name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./data/keystone.db

jobs:
  check:
    name: Typecheck · lint · unit + invariants · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1. install
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      # 2. typecheck + eslint (boundaries, no-duckdb-import, determinism) + no-domain-strings
      - run: pnpm typecheck
      - run: pnpm lint
      # 3. unit + invariants
      - run: pnpm test
      # 7. build
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E + a11y (scaffold)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          SESSION_SECRET: ci-only-session-secret
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
