name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:../data/keystone.db

jobs:
  check:
    name: Typecheck · lint · unit + invariants · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1. install
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      # 2. typecheck + eslint (boundaries, no-duckdb-import, determinism) + no-domain-strings
      - run: pnpm typecheck
      - run: pnpm lint
      # 3. unit + invariants + integration, with the src/lib coverage threshold
      - run: pnpm test:coverage
      # 4. pack:validate (all packs; builds warehouses at scale M)
      - run: pnpm pack:validate
      # 5. golden answers + agent eval suites, 6. knockout declared deltas
      - run: pnpm golden
      - run: pnpm knockout:deltas
      # 7. build
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E · a11y · stories
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          SESSION_SECRET: ci-only-session-secret
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: keystone:ci
          load: true
      - name: Smoke (health + ready)
        run: |
          docker run -d --name ks -p 3000:3000 -e SESSION_SECRET=ci-only-session-secret -e KEYSTONE_WAREHOUSE_AUTOBUILD=1 keystone:ci
          for i in $(seq 1 60); do curl -fsS localhost:3000/api/health && break; sleep 2; done
          curl -fsS localhost:3000/api/health || { docker logs ks; exit 1; }
          curl -fsS -o /dev/null localhost:3000/utilities/home || { docker logs ks; exit 1; }
          size=$(docker image inspect keystone:ci --format '{{.Size}}')
          echo "image size: $((size / 1048576)) MB (budget 300 MB)"
          [ "$size" -lt $((300 * 1048576)) ] || { echo "::error::image is over the 300 MB budget"; exit 1; }
