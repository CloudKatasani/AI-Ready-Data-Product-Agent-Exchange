# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.MARKET, kind: DYNAMIC TABLE, description: "Conformed market and region reference", target_lag: 1 day, upstream: [RAW_BRONZE.MKT_MARKET], grain: one row per market }
  - { fqn: CURATED_SILVER.RATE_PLAN, kind: DYNAMIC TABLE, description: "Rate plan catalogue with segment, line of business and monthly plan charge", target_lag: 1 day, upstream: [RAW_BRONZE.PRD_RATE_PLAN], grain: one row per rate plan }
  - { fqn: CURATED_SILVER.SUBSCRIBER, kind: DYNAMIC TABLE, description: "Subscriber master, deduplicated and conformed (holds PII and the MSISDN)", target_lag: 15 minutes, upstream: [RAW_BRONZE.CRM_SUBSCRIBER], grain: one row per subscriber }
  - { fqn: CURATED_SILVER.LINE_MONTH, kind: DYNAMIC TABLE, description: "Monthly base movements per line with save offers", target_lag: 1 day, upstream: [RAW_BRONZE.BSS_LINE_MONTH], grain: one row per line-month }
  - { fqn: CURATED_SILVER.INVOICE, kind: DYNAMIC TABLE, description: "Invoices with rated, leaked and billed charges", target_lag: 1 hour, upstream: [RAW_BRONZE.BSS_INVOICE], grain: one row per invoice }
  - { fqn: CURATED_SILVER.PAYMENT, kind: DYNAMIC TABLE, description: "Payments and write-offs (holds the tokenised card number; PCI)", target_lag: 1 hour, upstream: [RAW_BRONZE.BSS_PAYMENT], grain: one row per payment }
  - { fqn: CURATED_SILVER.USAGE_MONTHLY, kind: DYNAMIC TABLE, description: "Mediated usage per line-month (CPNI)", target_lag: 1 day, upstream: [RAW_BRONZE.MED_USAGE_MONTHLY], grain: one row per line-month }
  - { fqn: CURATED_SILVER.ROAMING_RECORD, kind: DYNAMIC TABLE, description: "Retail outbound and wholesale inbound roaming records", target_lag: 1 day, upstream: [RAW_BRONZE.ROAM_TAP_RECORD], grain: one row per roaming record }
  - { fqn: CURATED_SILVER.CELL_SITE, kind: DYNAMIC TABLE, description: "Cell site inventory", target_lag: 1 day, upstream: [RAW_BRONZE.NET_CELL_SITE], grain: one row per cell site }
  - { fqn: CURATED_SILVER.CELL_KPI_DAILY, kind: DYNAMIC TABLE, description: "Site-day counters with downtime and planned-maintenance flag", target_lag: 1 hour, upstream: [RAW_BRONZE.OSS_CELL_KPI_DAILY], grain: one row per site-day }
  - { fqn: CURATED_SILVER.NETWORK_FAULT, kind: DYNAMIC TABLE, description: "Network fault tickets with restoration time and impacted subscribers", target_lag: 15 minutes, upstream: [RAW_BRONZE.OSS_FAULT_TICKET], grain: one row per fault }
  - { fqn: CURATED_SILVER.TECHNICIAN, kind: DYNAMIC TABLE, description: "Field technicians (holds names; PII)", target_lag: 1 day, upstream: [RAW_BRONZE.FSM_TECHNICIAN], grain: one row per technician }
  - { fqn: CURATED_SILVER.WORK_ORDER, kind: DYNAMIC TABLE, description: "Field work orders with truck roll, first-time fix and activation lead time", target_lag: 15 minutes, upstream: [RAW_BRONZE.FSM_WORK_ORDER], grain: one row per work order }
  - { fqn: CURATED_SILVER.CARE_CONTACT, kind: DYNAMIC TABLE, description: "Customer care contacts", target_lag: 1 hour, upstream: [RAW_BRONZE.CARE_CONTACT], grain: one row per care contact }
  - { fqn: CURATED_SILVER.NPS_RESPONSE, kind: DYNAMIC TABLE, description: "NPS survey responses with promoter/detractor category", target_lag: 1 day, upstream: [RAW_BRONZE.CX_NPS_SURVEY], grain: one row per response }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2008-2026", upstream: [CURATED_SILVER.LINE_MONTH], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_MARKET, kind: TABLE, description: "Market dimension with region, site and technician counts", target_lag: 1 day, upstream: [CURATED_SILVER.MARKET, CURATED_SILVER.CELL_SITE, CURATED_SILVER.TECHNICIAN], grain: one row per market }
  - { fqn: CONFORMED_GOLD.DIM_PLAN, kind: TABLE, description: "Rate plan dimension", target_lag: 1 day, upstream: [CURATED_SILVER.RATE_PLAN], grain: one row per rate plan }
  - { fqn: CONFORMED_GOLD.DIM_SUBSCRIBER, kind: TABLE, description: "Conformed subscriber dimension with tenure, contract state, churn risk and care contacts", target_lag: 15 minutes, upstream: [CURATED_SILVER.SUBSCRIBER, CURATED_SILVER.CARE_CONTACT, CONFORMED_GOLD.DIM_MARKET, CONFORMED_GOLD.DIM_PLAN], grain: one row per subscriber }
  - { fqn: CONFORMED_GOLD.DIM_CELL_SITE, kind: TABLE, description: "Cell site dimension with market and region", target_lag: 1 day, upstream: [CURATED_SILVER.CELL_SITE, CONFORMED_GOLD.DIM_MARKET], grain: one row per cell site }
  - { fqn: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY, kind: DYNAMIC TABLE, description: "Monthly base movement fact — opening base, gross adds, churn, port-outs, migrations and save offers", target_lag: 1 day, upstream: [CURATED_SILVER.LINE_MONTH, CONFORMED_GOLD.DIM_SUBSCRIBER, CONFORMED_GOLD.DIM_PLAN, CONFORMED_GOLD.DIM_MARKET], grain: one row per line-month }
  - { fqn: CONFORMED_GOLD.FCT_BILLING, kind: DYNAMIC TABLE, description: "Invoice fact with service revenue, leakage, device installments, payment and bad debt", target_lag: 1 hour, upstream: [CURATED_SILVER.INVOICE, CURATED_SILVER.PAYMENT, CONFORMED_GOLD.DIM_SUBSCRIBER, CONFORMED_GOLD.DIM_PLAN, CONFORMED_GOLD.DIM_MARKET], grain: one row per invoice }
  - { fqn: CONFORMED_GOLD.FCT_MONTHLY_USAGE, kind: DYNAMIC TABLE, description: "Usage fact per line-month (CPNI columns masked)", target_lag: 1 day, upstream: [CURATED_SILVER.USAGE_MONTHLY, CONFORMED_GOLD.DIM_SUBSCRIBER, CONFORMED_GOLD.DIM_PLAN], grain: one row per line-month }
  - { fqn: CONFORMED_GOLD.FCT_NETWORK_DAILY, kind: DYNAMIC TABLE, description: "Site-day network performance fact", target_lag: 1 hour, upstream: [CURATED_SILVER.CELL_KPI_DAILY, CONFORMED_GOLD.DIM_CELL_SITE], grain: one row per site-day }
  - { fqn: CONFORMED_GOLD.FCT_NETWORK_FAULT, kind: DYNAMIC TABLE, description: "Fault fact with restoration time, SLA and impacted subscriber hours", target_lag: 15 minutes, upstream: [CURATED_SILVER.NETWORK_FAULT, CONFORMED_GOLD.DIM_CELL_SITE], grain: one row per fault }
  - { fqn: CONFORMED_GOLD.FCT_WORK_ORDER, kind: DYNAMIC TABLE, description: "Work order fact with first-time fix, truck rolls and activation lead time", target_lag: 15 minutes, upstream: [CURATED_SILVER.WORK_ORDER, CURATED_SILVER.TECHNICIAN, CONFORMED_GOLD.DIM_MARKET, CONFORMED_GOLD.DIM_SUBSCRIBER], grain: one row per work order }
  - { fqn: CONFORMED_GOLD.FCT_NPS_RESPONSE, kind: DYNAMIC TABLE, description: "NPS response fact", target_lag: 1 day, upstream: [CURATED_SILVER.NPS_RESPONSE, CONFORMED_GOLD.DIM_SUBSCRIBER], grain: one row per response }
  - { fqn: CONFORMED_GOLD.FCT_ROAMING, kind: DYNAMIC TABLE, description: "Roaming fact (retail outbound and wholesale inbound)", target_lag: 1 day, upstream: [CURATED_SILVER.ROAMING_RECORD, CONFORMED_GOLD.DIM_MARKET], grain: one row per roaming record }
