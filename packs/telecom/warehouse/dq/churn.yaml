# Base movement (churn) DQ rules.
- id: DQ-TEL-018
  object: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY
  column: line_month_id
  dimension: uniqueness
  assertion: "dup_rate == 0"
  severity: high
  alert_route: engineering
  description: 'One row per line-month (replayed lifecycle batches are removed).'
- id: DQ-TEL-019
  object: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY
  column: movement
  dimension: consistency
  assertion: "invalid_rate == 0"
  allowed: [Retained, Voluntary disconnect, Port-out, Involuntary disconnect, Plan migration, Gross add]
  severity: critical
  alert_route: steward
  description: 'Movement codes conform to the base movement catalogue.'
- id: DQ-TEL-020
  object: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY
  column: movement
  dimension: completeness
  assertion: "null_rate == 0"
  severity: critical
  alert_route: steward
  description: 'Every line-month carries a movement code (churn and net adds depend on it).'
- id: DQ-TEL-021
  object: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY
  column: prepaid_inactive
  dimension: completeness
  assertion: "null_rate == 0"
  severity: critical
  alert_route: steward
  description: 'The inactive-prepaid flag is populated on every line-month (BR-TEL-012 filters on it).'
- id: DQ-TEL-022
  object: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY
  column: segment
  dimension: consistency
  assertion: "invalid_rate == 0"
  allowed: [Postpaid, Prepaid, Broadband]
  severity: high
  alert_route: steward
  description: 'Segment is Postpaid, Prepaid or Broadband.'
- id: DQ-TEL-023
  object: CONFORMED_GOLD.FCT_SUBSCRIBER_MONTHLY
  column: month_end
  dimension: timeliness
  assertion: "freshness_min <= 2880"
  severity: high
  alert_route: engineering
  description: 'The monthly base movement load is current to the latest month-end.'
