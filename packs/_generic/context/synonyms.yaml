- term: Net revenue
  synonyms: [external revenue, consolidated revenue, group revenue]
  maps_to: { kind: metric, ref: net_revenue }
- term: Gross margin
  synonyms: [gross margin percent, gross profit margin, gm percent]
  maps_to: { kind: metric, ref: gross_margin_pct }
- term: Operating margin
  synonyms: [ebit margin, operating profit margin, op margin]
  maps_to: { kind: metric, ref: operating_margin_pct }
- term: Operating expense
  synonyms: [opex, overheads, sg&a]
  maps_to: { kind: metric, ref: operating_expense }
- term: Revenue vs budget
  synonyms: [revenue variance, revenue against plan, revenue versus plan, revenue versus budget]
  maps_to: { kind: metric, ref: revenue_vs_budget_pct }
- term: Intercompany
  synonyms: [intercompany sales, internal recharges, ic eliminations]
  maps_to: { kind: dimension, ref: intercompany }
- term: Business unit
  synonyms: [division, line of business, bu]
  maps_to: { kind: dimension, ref: business_unit }

