# Collections DQ rules.
- id: DQ-BNK-050
  object: CONFORMED_GOLD.FCT_COLLECTION_CASE
  column: outcome
  dimension: completeness
  assertion: "null_rate == 0"
  severity: critical
  alert_route: steward
  description: Every collection case carries an outcome (Open until resolved).
- id: DQ-BNK-051
  object: CONFORMED_GOLD.FCT_COLLECTION_CASE
  column: outcome
  dimension: consistency
  assertion: "invalid_rate == 0"
  allowed: [Cured, Payment plan, Charged off, Open]
  severity: high
  alert_route: steward
  description: Outcomes conform to the collections outcome list.
- id: DQ-BNK-052
  object: CONFORMED_GOLD.FCT_COLLECTION_CASE
  column: case_id
  dimension: uniqueness
  assertion: "dup_rate == 0"
  severity: high
  alert_route: engineering
  description: One row per collection case.
- id: DQ-BNK-053
  object: CONFORMED_GOLD.FCT_COLLECTION_CASE
  column: entry_date
  dimension: timeliness
  assertion: "freshness_min <= 2880"
  severity: medium
  alert_route: engineering
  description: New collection cases from the collections platform are no more than a day behind.
- id: DQ-BNK-054
  object: CONFORMED_GOLD.FCT_COLLECTION_CASE
  column: strategy
  dimension: consistency
  assertion: "invalid_rate == 0"
  allowed: [Digital self-service, Contact centre, Field collections, Third-party agency]
  severity: medium
  alert_route: steward
  description: Contact strategies conform to the collections strategy list.
- id: DQ-BNK-055
  object: CONFORMED_GOLD.FCT_COLLECTION_CASE
  column: recovered_amount
  dimension: accuracy
  assertion: "min >= 0"
  severity: medium
  alert_route: steward
  description: Recovered amounts are never negative.
