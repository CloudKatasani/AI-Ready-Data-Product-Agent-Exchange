# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.BRANCH, kind: DYNAMIC TABLE, description: "Conformed branch master", target_lag: 1 day, upstream: [RAW_BRONZE.CORE_BRANCH], grain: one row per branch }
  - { fqn: CURATED_SILVER.RELATIONSHIP_MANAGER, kind: DYNAMIC TABLE, description: "Relationship managers and their book", target_lag: 1 day, upstream: [RAW_BRONZE.CRM_RELATIONSHIP_MANAGER], grain: one row per relationship manager }
  - { fqn: CURATED_SILVER.CUSTOMER, kind: DYNAMIC TABLE, description: "Customer information file, deduplicated and conformed", target_lag: 15 minutes, upstream: [RAW_BRONZE.CORE_CUSTOMER], grain: one row per customer }
  - { fqn: CURATED_SILVER.KYC_REVIEW, kind: DYNAMIC TABLE, description: "Know-your-customer reviews", target_lag: 1 hour, upstream: [RAW_BRONZE.KYC_REVIEW], grain: one row per review }
  - { fqn: CURATED_SILVER.DEPOSIT_ACCOUNT, kind: DYNAMIC TABLE, description: "Deposit accounts with product and rate", target_lag: 1 hour, upstream: [RAW_BRONZE.CORE_DEPOSIT_ACCOUNT], grain: one row per deposit account }
  - { fqn: CURATED_SILVER.DEPOSIT_BALANCE, kind: DYNAMIC TABLE, description: "Month-end deposit balances with interest expense", target_lag: 1 day, upstream: [RAW_BRONZE.CORE_DEPOSIT_BALANCE], grain: one row per account-month }
  - { fqn: CURATED_SILVER.LOAN, kind: DYNAMIC TABLE, description: "Funded loans with origination terms", target_lag: 1 hour, upstream: [RAW_BRONZE.LOS_LOAN], grain: one row per loan }
  - { fqn: CURATED_SILVER.LOAN_BALANCE, kind: DYNAMIC TABLE, description: "Month-end loan snapshots with non-performing status, charge-offs and allowance", target_lag: 1 day, upstream: [RAW_BRONZE.CORE_LOAN_BALANCE], grain: one row per loan-month }
  - { fqn: CURATED_SILVER.CARD_ACCOUNT, kind: DYNAMIC TABLE, description: "Card accounts (holds the PAN; PCI)", target_lag: 1 hour, upstream: [RAW_BRONZE.CARD_ACCOUNT], grain: one row per card }
  - { fqn: CURATED_SILVER.CARD_AUTHORIZATION, kind: DYNAMIC TABLE, description: "Card authorisations with fraud loss", target_lag: 5 minutes, upstream: [RAW_BRONZE.CARD_AUTHORIZATION], grain: one row per authorisation }
  - { fqn: CURATED_SILVER.AML_ALERT, kind: DYNAMIC TABLE, description: "Transaction-monitoring alerts with disposition and SAR outcome", target_lag: 1 hour, upstream: [RAW_BRONZE.AML_TM_ALERT], grain: one row per alert }
  - { fqn: CURATED_SILVER.COLLECTION_CASE, kind: DYNAMIC TABLE, description: "Collection cases with promise-to-pay and outcome", target_lag: 1 hour, upstream: [RAW_BRONZE.COLL_CASE], grain: one row per collection case }
  - { fqn: CURATED_SILVER.DIGITAL_SESSION, kind: DYNAMIC TABLE, description: "Digital banking sessions", target_lag: 15 minutes, upstream: [RAW_BRONZE.DIG_SESSION], grain: one row per session }
  - { fqn: CURATED_SILVER.COMPLAINT, kind: DYNAMIC TABLE, description: "Customer complaints", target_lag: 1 hour, upstream: [RAW_BRONZE.CRM_COMPLAINT], grain: one row per complaint }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2015-2026", upstream: [CURATED_SILVER.LOAN_BALANCE], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_BRANCH, kind: TABLE, description: "Branch dimension with relationship-manager counts", target_lag: 1 day, upstream: [CURATED_SILVER.BRANCH, CURATED_SILVER.RELATIONSHIP_MANAGER], grain: one row per branch }
  - { fqn: CONFORMED_GOLD.DIM_CUSTOMER, kind: TABLE, description: "Conformed customer dimension with KYC review currency", target_lag: 15 minutes, upstream: [CURATED_SILVER.CUSTOMER, CURATED_SILVER.KYC_REVIEW, CONFORMED_GOLD.DIM_BRANCH], grain: one row per customer }
  - { fqn: CONFORMED_GOLD.DIM_LOAN, kind: TABLE, description: "Loan dimension with credit score and LTV bands", target_lag: 1 hour, upstream: [CURATED_SILVER.LOAN, CONFORMED_GOLD.DIM_CUSTOMER, CONFORMED_GOLD.DIM_BRANCH], grain: one row per loan }
  - { fqn: CONFORMED_GOLD.DIM_CARD, kind: TABLE, description: "Card dimension (no PAN)", target_lag: 1 hour, upstream: [CURATED_SILVER.CARD_ACCOUNT, CONFORMED_GOLD.DIM_CUSTOMER], grain: one row per card }
  - { fqn: CONFORMED_GOLD.FCT_DEPOSIT_BALANCE, kind: DYNAMIC TABLE, description: "Month-end deposit balance fact with insured/uninsured split", target_lag: 1 day, upstream: [CURATED_SILVER.DEPOSIT_BALANCE, CONFORMED_GOLD.DIM_CUSTOMER, CONFORMED_GOLD.DIM_BRANCH], grain: one row per account-month }
  - { fqn: CONFORMED_GOLD.FCT_LOAN_BALANCE, kind: DYNAMIC TABLE, description: "Month-end loan balance fact with delinquency and credit losses", target_lag: 1 day, upstream: [CURATED_SILVER.LOAN_BALANCE, CONFORMED_GOLD.DIM_LOAN], grain: one row per loan-month }
  - { fqn: CONFORMED_GOLD.FCT_CARD_TXN, kind: DYNAMIC TABLE, description: "Card authorisation fact with approved amount and fraud loss", target_lag: 5 minutes, upstream: [CURATED_SILVER.CARD_AUTHORIZATION, CONFORMED_GOLD.DIM_CARD], grain: one row per authorisation }
  - { fqn: CONFORMED_GOLD.FCT_AML_ALERT, kind: DYNAMIC TABLE, description: "Transaction-monitoring alert fact", target_lag: 1 hour, upstream: [CURATED_SILVER.AML_ALERT, CONFORMED_GOLD.DIM_CUSTOMER], grain: one row per alert }
  - { fqn: CONFORMED_GOLD.FCT_COLLECTION_CASE, kind: DYNAMIC TABLE, description: "Collection case fact with cure and charge-off outcomes", target_lag: 1 hour, upstream: [CURATED_SILVER.COLLECTION_CASE, CONFORMED_GOLD.DIM_LOAN, CONFORMED_GOLD.DIM_CUSTOMER], grain: one row per collection case }
  - { fqn: CONFORMED_GOLD.FCT_DIGITAL_SESSION, kind: DYNAMIC TABLE, description: "Digital banking session fact", target_lag: 15 minutes, upstream: [CURATED_SILVER.DIGITAL_SESSION, CONFORMED_GOLD.DIM_CUSTOMER], grain: one row per session }
  - { fqn: CONFORMED_GOLD.FCT_COMPLAINT, kind: DYNAMIC TABLE, description: "Complaint fact with resolution SLA", target_lag: 1 hour, upstream: [CURATED_SILVER.COMPLAINT, CONFORMED_GOLD.DIM_CUSTOMER], grain: one row per complaint }
