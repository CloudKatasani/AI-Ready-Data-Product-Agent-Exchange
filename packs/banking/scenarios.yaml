# Scripted scenarios for Ridgeline Bank — ported from AI-Ready banking `scenarios.ts` and the Marketplace
# AG-BNK-001..004 demo exchanges. Numbers come from golden.json; `expect` holds shape assertions only.
# Together the 25 scenarios cover all 15 patterns (04 §6).

# ================================================================ AG-BNK-002 Risk & Liquidity Analyst
- id: SC-BNK-001
  agent: AG-BNK-002
  pattern: 3
  question: "What was the NPL ratio by market last quarter?"
  paraphrases:
    - "What was the NPL ratio by region last quarter, excluding loans held for sale?"
    - "npl rate per market last qtr"
    - "non-performing loan ratio by footprint for Q3"
  kind: answer
  query: { view: LOAN_PORTFOLIO, metrics: [npl_ratio], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: npl_ratio, dir: desc }] }
  answer:
    headline: "{{top.region}} had the highest NPL ratio last quarter at {{top.npl_ratio}}%."
    narrative: "Loans held for sale are excluded (BR-BNK-012). {{bottom.region}} was lowest at {{bottom.npl_ratio}}% across {{rows}} markets; the bank-wide ratio was {{total.npl_ratio}}%."
    chart: bar
  followups: ["Which loan segments drove Southeast?", "Include loans held for sale", "NPL ratio trend this year"]
  expect: { rows: 4, top: { region: Southeast }, rules: [BR-BNK-012] }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-BNK-002
  agent: AG-BNK-002
  pattern: 10
  question: "What was the NPL ratio by market last quarter, including loans held for sale?"
  paraphrases:
    - "NPL ratio by market last quarter including held for sale"
    - "npl per market last qtr all loans"
  kind: answer
  query: { view: LOAN_PORTFOLIO, metrics: [npl_ratio], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: npl_ratio, dir: desc }] }
  answer:
    headline: "Including loans held for sale, {{top.region}} had the highest NPL ratio last quarter at {{top.npl_ratio}}%."
    narrative: "You asked for all loans, so the held-for-sale exclusion in BR-BNK-012 is not applied. The distressed Plains mortgage pool marked for sale reorders the ranking — compare with the standard view that excludes it."
    chart: bar
  followups: ["Exclude loans held for sale", "NPL ratio by loan segment in Plains"]
  expect: { rows: 4, top: { region: Plains } }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-BNK-003
  agent: AG-BNK-002
  pattern: 4
  question: "How has the net charge-off ratio trended month by month this year?"
  paraphrases:
    - "Monthly net charge-off ratio year to date"
    - "nco trend ytd by month"
  kind: answer
  query: { view: LOAN_PORTFOLIO, metrics: [net_charge_off_ratio], timeGrain: month, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "The net charge-off ratio is {{total.net_charge_off_ratio}}% year to date, moving {{delta.net_charge_off_ratio}} points from January to the latest month."
    narrative: "Annualised monthly net charge-offs over {{rows}} months, excluding loans held for sale (BR-BNK-012). Watch the July spike from Southeast commercial real estate."
    chart: line
  followups: ["NPL ratio by loan segment last quarter", "Allowance coverage by market"]
  expect: { rows: 9, rules: [BR-BNK-012] }

- id: SC-BNK-004
  agent: AG-BNK-002
  pattern: 7
  question: "How have total deposits changed quarter over quarter this year?"
  paraphrases:
    - "Total deposits by quarter year to date"
    - "is the deposit base growing quarter on quarter?"
  kind: answer
  query: { view: DEPOSITS, metrics: [total_deposits], timeGrain: quarter, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "Total deposits moved {{delta.total_deposits}} from the first to the latest quarter this year."
    narrative: "Average month-end deposits for each of the {{rows}} quarters this year (BR-BNK-009); the Q3 certificate-of-deposit promotion offset money market outflows in Southeast."
    chart: line
  followups: ["Deposits by product last quarter", "Cost of deposits by month this year"]
  expect: { rows: 3 }
  personas_expect: { A: { kind: decline } }

- id: SC-BNK-005
  agent: AG-BNK-002
  pattern: 2
  question: "Is the 30+ days past due rate within target this year?"
  paraphrases:
    - "Are we inside our delinquency target year to date?"
    - "30 plus dpd vs target ytd"
  kind: answer
  query: { view: LOAN_PORTFOLIO, metrics: [delinquency_30_plus_rate], timeRange: { ytd: true }, analysis: compare_target }
  answer:
    headline: "The 30+ days past due rate is {{top.delinquency_30_plus_rate}}% year to date — {{vsTarget.top}} target."
    narrative: "Principal 30 or more days past due as a share of total principal, excluding loans held for sale (BR-BNK-012)."
    chart: kpi
  followups: ["30+ DPD by loan segment", "NPL ratio by market last quarter"]
  expect: { rows: 1, rules: [BR-BNK-012] }

- id: SC-BNK-006
  agent: AG-BNK-002
  pattern: 15
  question: "What is our card fraud loss rate this quarter?"
  paraphrases:
    - "How much are we losing to card fraud?"
  kind: redirect
  query: null
  redirect_to: AG-BNK-003
  answer:
    headline: "That's a card fraud question — the Financial Crimes Copilot answers it."
    narrative: "I cover credit risk, deposits and liquidity. The Financial Crimes Copilot is certified on card transactions and fraud losses."
    chart: none
  followups: ["Ask the Financial Crimes Copilot", "What can you answer?"]

- id: SC-BNK-007
  agent: AG-BNK-002
  pattern: 15
  question: "Approve a loan modification for this borrower."
  paraphrases:
    - "Can you sign off the loan modification request?"
    - "Reprice this commercial loan for me"
  kind: decline
  query: null
  answer:
    headline: "I can't approve or price loans — that is outside what this agent is allowed to do."
    narrative: "Loan modifications are decided by credit officers under delegated authority. I can show you credit quality for the segment and market so the decision has the evidence."
    chart: none
  followups: ["NPL ratio by loan segment last quarter", "30+ days past due rate by market"]

# ================================================================ AG-BNK-001 Relationship Manager Assistant
- id: SC-BNK-008
  agent: AG-BNK-001
  pattern: 3
  question: "What is our digital active rate by market?"
  paraphrases:
    - "Which market has the highest digital adoption?"
    - "digital engagement by footprint"
  kind: answer
  query: { view: CUSTOMER_360, metrics: [digital_active_rate], dimensions: [region], orderBy: [{ field: digital_active_rate, dir: desc }] }
  answer:
    headline: "{{top.region}} leads digital engagement at {{top.digital_active_rate}}% of active customers."
    narrative: "{{bottom.region}} trails at {{bottom.digital_active_rate}}%. Digitally active means a mobile or online login in the last 30 days (BR-BNK-011)."
    chart: bar
  followups: ["Digital active rate by age band", "Products per customer by market"]
  expect: { rows: 4, top: { region: Great Lakes } }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-BNK-009
