  query: { view: CUSTOMER_360, metrics: [avg_relationship_balance], dimensions: [customer_name], filters: [{ dimension: customer_status, op: "=", value: Active }], orderBy: [{ field: avg_relationship_balance, dir: desc }], limit: 5, analysis: rank }
  answer:
    headline: "The largest active relationship holds {{top.avg_relationship_balance}}."
    narrative: "Customer names are masked unless your persona is cleared for PII under the masking policy. Showing the top {{rows}} active relationships by balance."
