  question: "What is the average relationship balance by market?"
  paraphrases:
    - "balance per customer by region"
    - "average relationship balance per footprint"
  kind: answer
  query: { view: CUSTOMER_360, metrics: [avg_relationship_balance], dimensions: [region], orderBy: [{ field: avg_relationship_balance, dir: desc }] }
  answer:
    headline: "{{top.region}} has the highest average relationship balance at {{top.avg_relationship_balance}}."
    narrative: "Mean relationship balance per active customer across the {{rows}} markets you are entitled to see; the market row-access policy applies."
    chart: bar
  followups: ["Relationship balance by segment", "Digital active rate by market"]
  expect: { rows: 4 }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-BNK-012
  agent: AG-BNK-001
  pattern: 8
  question: "How is average ticket distributed across merchant categories this year?"
  paraphrases:
    - "Spread of average ticket by merchant category"
    - "average purchase percentiles across mcc groups"
  kind: answer
  query: { view: CARD_PAYMENTS, metrics: [avg_ticket], dimensions: [merchant_category], timeRange: { ytd: true }, analysis: distribution }
  answer:
    headline: "Across {{top.merchant_category_count}} merchant categories, the median average ticket is {{top.avg_ticket_p50}}."
    narrative: "The middle 80% of categories sit between {{top.avg_ticket_p10}} and {{top.avg_ticket_p90}}; the highest category averages {{top.avg_ticket_max}}."
    chart: table
  followups: ["Card purchase volume by merchant category", "Average ticket by card product"]
  expect: { rows: 1 }

