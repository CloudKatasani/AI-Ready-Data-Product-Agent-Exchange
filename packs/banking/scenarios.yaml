# ================================================================ AG-BNK-003 Financial Crimes Copilot
- id: SC-BNK-014
  agent: AG-BNK-003
  pattern: 5
  question: "Which five merchant categories had the highest card fraud loss rate last quarter?"
  paraphrases:
    - "Top 5 merchant categories by fraud bps last quarter"
    - "worst mcc groups for fraud last qtr"
  kind: answer
  query: { view: CARD_PAYMENTS, metrics: [fraud_loss_bps], dimensions: [merchant_category], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: fraud_loss_bps, dir: desc }], limit: 5, analysis: rank }
  answer:
    headline: "{{top.merchant_category}} had the highest card fraud loss rate last quarter at {{top.fraud_loss_bps}} bps."
    narrative: "The {{rows}} worst merchant categories by confirmed fraud losses per 10,000 dollars of approved volume. Categories above 50 bps qualify for enhanced card-not-present authentication (BR-BNK-015)."
    chart: bar
  followups: ["Fraud losses by card channel", "Approval rate by card channel"]
  expect: { rows: 5, top: { merchant_category: Digital goods } }

- id: SC-BNK-015
  agent: AG-BNK-003
  pattern: 14
  question: "What is our AML alert-to-case rate this year?"
  paraphrases:
    - "AML alert-to-case rate year to date"
    - "alert escalation rate ytd"
  kind: answer
  query: { view: AML_ALERTS, metrics: [alert_to_case_rate], timeRange: { ytd: true } }
  answer:
    headline: "The alert-to-case rate is {{top.alert_to_case_rate}}% this year."
    narrative: "AML Alerts & Cases is still in certification, so treat this figure as provisional. Pending alerts are excluded (BR-BNK-019)."
    chart: kpi
  followups: ["Alert-to-case rate by monitoring scenario", "When will AML Alerts & Cases be certified?"]
  expect: { rows: 1, certified: false }
  personas_expect: { A: { kind: decline } }

- id: SC-BNK-016
  agent: AG-BNK-003
  pattern: 6
  question: "What is driving card fraud losses by card channel last quarter?"
  paraphrases:
    - "Which card channels contribute most to fraud losses?"
    - "fraud dollars by entry mode last quarter"
  kind: answer
  query: { view: CARD_PAYMENTS, metrics: [fraud_losses], dimensions: [card_channel], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: fraud_losses, dir: desc }], analysis: contribution }
  answer:
    headline: "{{top.card_channel}} drove the most card fraud losses last quarter at {{top.fraud_losses}}."
    narrative: "Total confirmed fraud losses were {{total.fraud_losses}} across {{rows}} card channels."
    chart: bar
  followups: ["Fraud loss rate by merchant category", "Approval rate by card channel"]
  expect: { rows: 3, top: { card_channel: Card not present } }

- id: SC-BNK-017
  agent: AG-BNK-003
  pattern: 9
  question: "How do the approval rate and fraud loss rate compare across card products this year?"
  paraphrases:
    - "Compare approval rate and fraud bps by card tier"
    - "card product comparison of approvals and fraud"
  kind: answer
  query: { view: CARD_PAYMENTS, metrics: [auth_approval_rate, fraud_loss_bps], dimensions: [card_product], timeRange: { ytd: true }, orderBy: [{ field: fraud_loss_bps, dir: desc }] }
  answer:
    headline: "{{top.card_product}} cards have the highest fraud loss rate this year at {{top.fraud_loss_bps}} bps, with a {{top.auth_approval_rate}}% approval rate."
    narrative: "{{bottom.card_product}} is lowest at {{bottom.fraud_loss_bps}} bps and {{bottom.auth_approval_rate}}% approval, across {{rows}} card products."
    chart: bar
  followups: ["Fraud loss rate by merchant category", "Card purchase volume by card product"]
  expect: { rows: 4 }

- id: SC-BNK-018
  agent: AG-BNK-003
  pattern: 15
  question: "Block the card that triggered the fraud alert."
