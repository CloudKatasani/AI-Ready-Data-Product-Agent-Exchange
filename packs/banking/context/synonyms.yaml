# Ridgeline Bank synonyms (synthetic): banking jargon → governed metric, dimension, value or glossary term.

# ── Credit risk ─────────────────────────────────────────────────────────────────────────────────────
- term: NPL ratio
  synonyms: [non-performing loans ratio, bad loan ratio, npls, nonaccrual and 90 plus]
  maps_to: { kind: metric, ref: npl_ratio }
- term: 30+ days past due rate
  synonyms: [delinquencies, early delinquency, 30 plus dpd, past dues]
  maps_to: { kind: metric, ref: delinquency_30_plus_rate }
- term: Net charge-off ratio
  synonyms: [ncos, net charge-off rate, write-off rate, annualised losses]
  maps_to: { kind: metric, ref: net_charge_off_ratio }
- term: Allowance coverage of NPLs
  synonyms: [reserve coverage, alll coverage, reserves to npls]
  maps_to: { kind: metric, ref: allowance_coverage }
- term: Total loans
  synonyms: [loan book, loans on the books, gross loans outstanding]
  maps_to: { kind: metric, ref: total_loans }
- term: Loan yield
  synonyms: [loan rate, average loan rate, what we earn on loans]
  maps_to: { kind: metric, ref: loan_yield }
- term: Loan segment
  synonyms: [lending product, loan portfolio segment, asset class]
  maps_to: { kind: dimension, ref: loan_segment }
- term: Commercial real estate
  synonyms: [cre, commercial property, office loans]
  maps_to: { kind: value, ref: loan_segment=Commercial real estate }
- term: Held for sale
  synonyms: [hfs pool, loan sale pool]
  maps_to: { kind: dimension, ref: held_for_sale }

