id: AG-BNK-002
name: Risk & Liquidity Analyst
domain: Lending & Credit Risk
status: PRODUCTION
owner: banking:lending-dpo
on_call: Risk Data Ops
avatar: { icon: activity, hue: 160 }
capability: "Answers questions on deposits, funding cost, uninsured concentration, loans outstanding, delinquency, NPLs, net charge-offs, allowance coverage and loan yield."
personas_served: [Chief Risk Officer, Treasurer, Credit Risk Analyst, Market Banking Manager]
out_of_scope: ["approving or pricing loans", "loan modifications", "setting deposit rates", "regulatory filing preparation"]
products:
  - { id: DP-BNK-002, columns: "*" }
  - { id: DP-BNK-003, columns: "*" }
tools:
  - { tool: semantic_query, views: [LOAN_PORTFOLIO, DEPOSITS], row_limit: 500 }
  - { tool: search_context, corpora: [DOC-BNK-CREDIT-POLICY, DOC-BNK-LIQUIDITY] }
  - { tool: get_definition }
  - { tool: get_product_status }
kpi_coverage:
  - { kpi: KPI-BNK-NPL, grains: [month, quarter, year], slices: [region, loan_segment, fico_band, branch], depth: rank_drivers }
  - { kpi: KPI-BNK-DPD30, grains: [month, quarter, year], slices: [region, loan_segment, fico_band], depth: rank_drivers }
  - { kpi: KPI-BNK-NCO, grains: [month, quarter, year], slices: [region, loan_segment], depth: explain }
  - { kpi: KPI-BNK-ACL-COVER, grains: [month, quarter], slices: [region, loan_segment], depth: explain }
  - { kpi: KPI-BNK-LOANS, grains: [month, quarter], slices: [region, loan_segment, branch], depth: trend }
  - { kpi: KPI-BNK-YIELD, grains: [month, quarter], slices: [loan_segment, region], depth: value }
  - { kpi: KPI-BNK-DEPOSITS, grains: [month, quarter, year], slices: [region, branch, deposit_product, segment], depth: rank_drivers }
  - { kpi: KPI-BNK-COST-DEP, grains: [month, quarter], slices: [deposit_product, region, segment], depth: explain }
  - { kpi: KPI-BNK-NIB, grains: [month, quarter], slices: [region, segment], depth: trend }
  - { kpi: KPI-BNK-UNINSURED, grains: [month, quarter], slices: [segment, region, deposit_product], depth: rank_drivers }
instructions: [INS-BNK-002-P, INS-BNK-002-R, INS-BNK-002-G, INS-BNK-002-O]
guardrails: { citations_required: true, refuse_customer_level: true, pii_output: deny, max_followups: 3 }
budgets: { cost_per_answer_usd: 0.06, p95_latency_ms: 8000, max_tool_rounds: 5 }
eval: { golden_min: 0.92, groundedness_min: 1.0, boundary_min: 1.0, adversarial_min: 1.0, entitlement_min: 1.0 }
scenarios: [SC-BNK-001, SC-BNK-002, SC-BNK-003, SC-BNK-004, SC-BNK-005, SC-BNK-006, SC-BNK-007]
