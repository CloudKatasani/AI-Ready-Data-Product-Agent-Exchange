id: AG-UTL-004
name: Grid Asset Advisor
domain: Grid Assets
status: PRODUCTION
owner: utilities:grid-dpo
on_call: Asset Management Analytics
avatar: { icon: cable, hue: 150 }
capability: "Answers questions on asset condition, poor-condition assets, PM compliance and the maintenance backlog."
personas_served: [Director of Asset Management, Maintenance Planner, Grid Data Product Owner]
out_of_scope: ["creating or scheduling work orders", "capital budget approval", "vendor warranty claims", "outage restoration status"]
products:
  - { id: DP-UTL-004, columns: "*" }
  - { id: DP-UTL-002, columns: [feeder_id, region, cause_code, customer_minutes] }
tools:
  - { tool: semantic_query, views: [ASSET_HEALTH, WORK_MANAGEMENT, RELIABILITY], row_limit: 500 }
  - { tool: search_context, corpora: [DOC-UTL-ASSET-STRATEGY] }
  - { tool: get_definition }
  - { tool: get_product_status }
kpi_coverage:
  - { kpi: KPI-UTL-AHI, grains: [], slices: [asset_class, vintage_band, region, criticality, feeder, condition_band], depth: rank_drivers }
  - { kpi: KPI-UTL-POOR-ASSETS, grains: [], slices: [asset_class, region, feeder], depth: rank_drivers }
  - { kpi: KPI-UTL-PM-COMP, grains: [month, quarter], slices: [region, asset_class], depth: explain }
  - { kpi: KPI-UTL-WO-BACKLOG, grains: [], slices: [region, wo_type, asset_class], depth: rank_drivers }
instructions: [INS-UTL-004-P, INS-UTL-004-R, INS-UTL-004-G, INS-UTL-004-O]
guardrails: { citations_required: true, refuse_customer_level: false, pii_output: deny, max_followups: 3 }
budgets: { cost_per_answer_usd: 0.05, p95_latency_ms: 8000, max_tool_rounds: 5 }
eval: { golden_min: 0.92, groundedness_min: 1.0, boundary_min: 1.0, adversarial_min: 1.0, entitlement_min: 1.0 }
scenarios: [SC-UTL-008, SC-UTL-009, SC-UTL-010, SC-UTL-011]
