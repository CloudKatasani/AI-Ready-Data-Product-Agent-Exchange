    narrative: "Average kWh per meter-day across {{rows}} regions you are entitled to see; region row-access policy applies."
    chart: bar
  followups: ["Consumption by premise type", "Peak demand by rate class"]
  expect: { rows: 5 }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-UTL-016
  agent: AG-UTL-001
  pattern: 4
  question: "How did the AMI read success rate trend day by day last quarter?"
  paraphrases:
    - "daily meter read rate last quarter"
    - "ami performance trend last qtr"
  kind: answer
  query: { view: METERING, metrics: [read_success_rate], timeGrain: day, timeRange: { last: { n: 1, unit: quarter } }, analysis: trend }
