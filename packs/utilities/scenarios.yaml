- id: SC-UTL-017
  agent: AG-UTL-001
  pattern: 11
  question: "How are our bills looking?"
  paraphrases:
    - "bills update"
  kind: clarify
  query: null
  answer:
    headline: "\"Bills\" can mean a few things — which one do you need?"
    narrative: "I can show the average monthly bill, the estimated bill rate, or bills issued. Pick one and a period."
    chart: none
  followups: ["Average monthly bill by region last quarter", "Estimated bill rate trend this year", "Bills issued last month"]

# ================================================================ AG-UTL-003 Procurement Copilot
- id: SC-UTL-018
  agent: AG-UTL-003
  pattern: 1
  question: "What percentage of our spend this year was under contract?"
  paraphrases:
    - "contract compliance year to date"
    - "on-contract spend share ytd"
  kind: answer
  query: { view: PROCUREMENT, metrics: [spend_under_contract_pct], timeRange: { ytd: true }, analysis: value }
  answer:
    headline: "{{top.spend_under_contract_pct}}% of spend this year was under contract."
    narrative: "Spend on purchase-order lines placed against an active contract, as a share of total spend year to date."
    chart: kpi
  followups: ["Where is maverick spend highest?", "Contract compliance by category"]
  expect: { rows: 1 }

- id: SC-UTL-019
  agent: AG-UTL-003
  pattern: 5
  question: "Which five suppliers have the worst OTIF this year?"
  paraphrases:
    - "Bottom 5 suppliers by on time in full"
    - "worst delivery performance vendors ytd"
  kind: answer
  query: { view: PROCUREMENT, metrics: [otif_pct], dimensions: [supplier], timeRange: { ytd: true }, orderBy: [{ field: otif_pct, dir: asc }], limit: 5, analysis: rank }
  answer:
    headline: "{{top.supplier}} has the lowest OTIF this year at {{top.otif_pct}}%."
    narrative: "The {{rows}} lowest-performing suppliers by on-time-in-full delivery year to date."
    chart: bar
  followups: ["PO cycle time by category", "Spend with these suppliers"]
  expect: { rows: 5 }

- id: SC-UTL-020
  agent: AG-UTL-003
  pattern: 6
  question: "Where is our off-contract spend by commodity this year?"
  paraphrases:
    - "Where is maverick spend highest by category?"
    - "non-compliant spend by material group"
  kind: answer
  query: { view: PROCUREMENT, metrics: [maverick_spend], dimensions: [category], timeRange: { ytd: true }, orderBy: [{ field: maverick_spend, dir: desc }], analysis: contribution }
  answer:
    headline: "{{top.category}} drives the most maverick spend this year at {{top.maverick_spend}}."
    narrative: "Off-contract spend is maverick spend; commodity maps to spend category. Total maverick spend is {{total.maverick_spend}} across {{rows}} categories."
    chart: bar
  followups: ["Maverick spend by supplier", "Contract compliance trend"]
  expect: { rows: 8 }

- id: SC-UTL-021
  agent: AG-UTL-003
  pattern: 7
  question: "How has PO cycle time changed quarter over quarter this year?"
  paraphrases:
    - "PO to receipt time by quarter ytd"
    - "is our lead time improving quarter on quarter?"
  kind: answer
  query: { view: PROCUREMENT, metrics: [po_cycle_days], timeGrain: quarter, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "PO cycle time moved {{delta.po_cycle_days}} days versus the previous quarter."
    narrative: "Average days from purchase order to receipt for each of the {{rows}} quarters this year."
    chart: line
  followups: ["Cycle time by category", "Which suppliers have the worst OTIF?"]
  expect: { rows: 3 }

# ================================================================ AG-UTL-005 Data Steward Assistant (no semantic views)
- id: SC-UTL-022
  agent: AG-UTL-005
  pattern: 15
  question: "What can you answer?"
  paraphrases:
    - "What can you help me with?"
    - "help"
  kind: help
  query: null
  answer:
    headline: "I explain governance across the data estate — I don't analyse business KPIs."
    narrative: "Ask me what a glossary term or metric means, the certification status of a data product, or where governance gaps such as missing stewards or masking sit. For KPI numbers, ask the domain agents."
    chart: none
  followups: ["Which products are not yet certified?", "What does SAIDI mean?", "Which critical data elements lack a steward?"]

- id: SC-UTL-023
  agent: AG-UTL-005
  pattern: 15
  question: "Approve the access request for Billing & Receivables."
  paraphrases:
    - "Grant me access to DP-UTL-005"
    - "Can you approve my access request?"
  kind: decline
  query: null
  answer:
    headline: "I can't approve access requests — agents act, humans decide."
    narrative: "Access to a data product is granted only by its owner or steward through the access workflow. I can show you the request status and who can approve it."
    chart: none
  followups: ["Who can approve access to Billing & Receivables?", "What is the certification status of Billing & Receivables?"]
