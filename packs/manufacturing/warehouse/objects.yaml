# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.PLANT_SITE, kind: DYNAMIC TABLE, description: "Conformed plant master with business unit and grid emission factor", target_lag: 1 day, upstream: [RAW_BRONZE.MDM_PLANT], grain: one row per plant }
  - { fqn: CURATED_SILVER.PRODUCTION_LINE, kind: DYNAMIC TABLE, description: "Production line master with nameplate ideal cycle time", target_lag: 1 day, upstream: [RAW_BRONZE.MDM_LINE], grain: one row per line }
  - { fqn: CURATED_SILVER.EQUIPMENT_ASSET, kind: DYNAMIC TABLE, description: "Equipment per line with criticality", target_lag: 1 day, upstream: [RAW_BRONZE.EAM_ASSET], grain: one row per asset }
  - { fqn: CURATED_SILVER.OPERATOR_ROSTER, kind: DYNAMIC TABLE, description: "Operator roster, deduplicated and conformed", target_lag: 15 minutes, upstream: [RAW_BRONZE.HR_OPERATOR], grain: one row per badge }
  - { fqn: CURATED_SILVER.LINE_SHIFT_PRODUCTION, kind: DYNAMIC TABLE, description: "Validated shift production records with conformed run types and loss reasons", target_lag: 15 minutes, upstream: [RAW_BRONZE.MES_SHIFT_PRODUCTION], grain: one row per line shift }
  - { fqn: CURATED_SILVER.DOWNTIME_EVENT, kind: DYNAMIC TABLE, description: "Line stoppages classified planned or unplanned", target_lag: 15 minutes, upstream: [RAW_BRONZE.MES_DOWNTIME_EVENT], grain: one row per downtime event }
  - { fqn: CURATED_SILVER.INSPECTION_LOT, kind: DYNAMIC TABLE, description: "Inspection lots with first-pass result, usage decision, NCR and cost of poor quality", target_lag: 1 hour, upstream: [RAW_BRONZE.QMS_INSPECTION_LOT], grain: one row per inspection lot }
  - { fqn: CURATED_SILVER.WORK_ORDER, kind: DYNAMIC TABLE, description: "Corrective and preventive work orders with repair hours and cost", target_lag: 30 minutes, upstream: [RAW_BRONZE.EAM_WORK_ORDER], grain: one row per work order }
  - { fqn: CURATED_SILVER.SUPPLIER_MASTER, kind: DYNAMIC TABLE, description: "Supplier master by commodity", target_lag: 1 day, upstream: [RAW_BRONZE.SRM_SUPPLIER], grain: one row per supplier }
  - { fqn: CURATED_SILVER.GOODS_RECEIPT, kind: DYNAMIC TABLE, description: "Received goods with OTIF flags, incoming rejects and lead time", target_lag: 1 hour, upstream: [RAW_BRONZE.SRM_GOODS_RECEIPT], grain: one row per goods receipt }
  - { fqn: CURATED_SILVER.DISTRIBUTOR_MASTER, kind: DYNAMIC TABLE, description: "Distributor master with sales region, tier and order-desk contact", target_lag: 1 day, upstream: [RAW_BRONZE.CRM_DISTRIBUTOR], grain: one row per distributor }
  - { fqn: CURATED_SILVER.PRODUCT_FAMILY, kind: DYNAMIC TABLE, description: "Product families with owning business unit", target_lag: 1 day, upstream: [RAW_BRONZE.MDM_PRODUCT_FAMILY], grain: one row per product family }
  - { fqn: CURATED_SILVER.SALES_ORDER_LINE, kind: DYNAMIC TABLE, description: "Distributor order lines with promise and proof-of-delivery dates", target_lag: 1 hour, upstream: [RAW_BRONZE.ERP_SALES_ORDER_LINE], grain: one row per order line }
  - { fqn: CURATED_SILVER.MATERIAL_MASTER, kind: DYNAMIC TABLE, description: "Material master with class, status and ABC class", target_lag: 1 day, upstream: [RAW_BRONZE.ERP_MATERIAL], grain: one row per material }
  - { fqn: CURATED_SILVER.INVENTORY_POSITION, kind: DYNAMIC TABLE, description: "One inventory position per material, plant and day, valued at standard cost", target_lag: 1 hour, upstream: [RAW_BRONZE.ERP_INVENTORY_SNAPSHOT], grain: one row per material per plant per day }
  - { fqn: CURATED_SILVER.WARRANTY_LOT, kind: DYNAMIC TABLE, description: "Shipped lots with warranty claims and claim cost", target_lag: 1 day, upstream: [RAW_BRONZE.SVC_WARRANTY_LOT], grain: one row per shipped lot }
  - { fqn: CURATED_SILVER.SAFETY_INCIDENT, kind: DYNAMIC TABLE, description: "Safety incidents and near misses by severity", target_lag: 1 day, upstream: [RAW_BRONZE.EHS_INCIDENT], grain: one row per incident }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2019-2026 with production weeks", upstream: [CURATED_SILVER.LINE_SHIFT_PRODUCTION], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_PLANT, kind: TABLE, description: "Plant dimension", target_lag: 1 day, upstream: [CURATED_SILVER.PLANT_SITE], grain: one row per plant }
  - { fqn: CONFORMED_GOLD.DIM_LINE, kind: TABLE, description: "Production line dimension with plant, business unit and nameplate speed", target_lag: 1 day, upstream: [CURATED_SILVER.PRODUCTION_LINE, CONFORMED_GOLD.DIM_PLANT], grain: one row per line }
  - { fqn: CONFORMED_GOLD.DIM_ASSET, kind: TABLE, description: "Asset dimension with criticality", target_lag: 1 day, upstream: [CURATED_SILVER.EQUIPMENT_ASSET, CONFORMED_GOLD.DIM_LINE], grain: one row per asset }
  - { fqn: CONFORMED_GOLD.DIM_OPERATOR, kind: TABLE, description: "Conformed operator dimension (current roster)", target_lag: 15 minutes, upstream: [CURATED_SILVER.OPERATOR_ROSTER], grain: one row per badge }
  - { fqn: CONFORMED_GOLD.DIM_SUPPLIER, kind: TABLE, description: "Supplier dimension", target_lag: 1 day, upstream: [CURATED_SILVER.SUPPLIER_MASTER], grain: one row per supplier }
  - { fqn: CONFORMED_GOLD.FCT_LINE_SHIFT, kind: DYNAMIC TABLE, description: "Production fact at line × shift grain: OEE time base, counts, losses and energy", target_lag: 15 minutes, upstream: [CURATED_SILVER.LINE_SHIFT_PRODUCTION, CONFORMED_GOLD.DIM_LINE, CONFORMED_GOLD.DIM_OPERATOR], grain: one row per line shift }
  - { fqn: CONFORMED_GOLD.FCT_INSPECTION_LOT, kind: DYNAMIC TABLE, description: "Inspection lot fact with first-pass result, defects and cost of poor quality", target_lag: 1 hour, upstream: [CURATED_SILVER.INSPECTION_LOT, CONFORMED_GOLD.DIM_LINE], grain: one row per inspection lot }
  - { fqn: CONFORMED_GOLD.FCT_WORK_ORDER, kind: DYNAMIC TABLE, description: "Maintenance fact at work-order grain (failures and preventive work)", target_lag: 30 minutes, upstream: [CURATED_SILVER.WORK_ORDER, CONFORMED_GOLD.DIM_ASSET], grain: one row per work order }
  - { fqn: CONFORMED_GOLD.FCT_GOODS_RECEIPT, kind: DYNAMIC TABLE, description: "Inbound delivery fact at receipt grain", target_lag: 1 hour, upstream: [CURATED_SILVER.GOODS_RECEIPT, CONFORMED_GOLD.DIM_SUPPLIER, CONFORMED_GOLD.DIM_PLANT], grain: one row per goods receipt }
  - { fqn: CONFORMED_GOLD.FCT_ORDER_LINE, kind: DYNAMIC TABLE, description: "Order-to-delivery fact at order-line grain with distributor attributes", target_lag: 1 hour, upstream: [CURATED_SILVER.SALES_ORDER_LINE, CURATED_SILVER.PRODUCT_FAMILY, CURATED_SILVER.DISTRIBUTOR_MASTER], grain: one row per order line }
  - { fqn: CONFORMED_GOLD.FCT_INVENTORY_SNAPSHOT, kind: DYNAMIC TABLE, description: "Daily material-plant inventory position fact", target_lag: 1 hour, upstream: [CURATED_SILVER.INVENTORY_POSITION, CONFORMED_GOLD.DIM_PLANT], grain: one row per material per plant per day }
  - { fqn: CONFORMED_GOLD.FCT_WARRANTY_LOT, kind: DYNAMIC TABLE, description: "Field warranty fact at shipped-lot grain", target_lag: 1 day, upstream: [CURATED_SILVER.WARRANTY_LOT, CURATED_SILVER.PRODUCT_FAMILY], grain: one row per shipped lot }
  - { fqn: CONFORMED_GOLD.FCT_SAFETY_MONTH, kind: TABLE, description: "Plant-month safety fact: hours worked and incidents by severity", target_lag: 1 day, upstream: [CURATED_SILVER.SAFETY_INCIDENT, CONFORMED_GOLD.DIM_PLANT], grain: one row per plant per month }
