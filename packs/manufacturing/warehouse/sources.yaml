  - name: MDM_PRODUCT_FAMILY
    system: Product lifecycle management (PLM)
    description: Finished product families with owning business unit, synthetic unit price, standard cost and warranty term
    key: family_id
    rows: { S: 12, M: 12, L: 12 }
    cdc_noise: { duplicate_updates_pct: 2 }
    columns:
      - { name: family_id, type: VARCHAR, gen: { seq: { prefix: "PF-", pad: 2 } } }
      - { name: family_name, type: VARCHAR, gen: { template: "Family {family_id}" }, dirty: false }
      - { name: business_unit, type: VARCHAR, gen: { choice: { values: [Motion Systems, Fluid Power, Industrial Controls, Aerospace Components] } }, dirty: false }
      - { name: unit_price_usd, type: DOUBLE, gen: { uniform: { min: 40, max: 1200, decimals: 2 } } }
      - { name: std_unit_cost_usd, type: DOUBLE, gen: { formula: "unit_price_usd * 0.62", decimals: 2 }, tags: [TRADE_SECRET] }
      - { name: warranty_months, type: INTEGER, gen: { choice: { values: [12, 24, 36], weights: [30, 50, 20] } } }
    plant:
      # Product catalogue (AI-Ready PRODUCT_FAMILIES): three families per business unit; prices are synthetic.
      - { id: P-MFG-42, description: "PF-01 Servo motors (Motion Systems)", where: { family_id: PF-01 }, adjust: { family_name: { set: Servo motors }, business_unit: { set: Motion Systems }, unit_price_usd: { set: 640 }, std_unit_cost_usd: { set: 402 } } }
      - { id: P-MFG-43, description: "PF-02 Gearboxes (Motion Systems)", where: { family_id: PF-02 }, adjust: { family_name: { set: Gearboxes }, business_unit: { set: Motion Systems }, unit_price_usd: { set: 910 }, std_unit_cost_usd: { set: 588 } } }
      - { id: P-MFG-44, description: "PF-03 Linear actuators (Motion Systems)", where: { family_id: PF-03 }, adjust: { family_name: { set: Linear actuators }, business_unit: { set: Motion Systems }, unit_price_usd: { set: 420 }, std_unit_cost_usd: { set: 251 } } }
      - { id: P-MFG-45, description: "PF-04 Hydraulic pumps (Fluid Power)", where: { family_id: PF-04 }, adjust: { family_name: { set: Hydraulic pumps }, business_unit: { set: Fluid Power }, unit_price_usd: { set: 1280 }, std_unit_cost_usd: { set: 803 } } }
      - { id: P-MFG-46, description: "PF-05 Directional valves (Fluid Power)", where: { family_id: PF-05 }, adjust: { family_name: { set: Directional valves }, business_unit: { set: Fluid Power }, unit_price_usd: { set: 360 }, std_unit_cost_usd: { set: 214 } } }
      - { id: P-MFG-47, description: "PF-06 Hose assemblies (Fluid Power)", where: { family_id: PF-06 }, adjust: { family_name: { set: Hose assemblies }, business_unit: { set: Fluid Power }, unit_price_usd: { set: 48 }, std_unit_cost_usd: { set: 27 } } }
      - { id: P-MFG-48, description: "PF-07 PLC modules (Industrial Controls)", where: { family_id: PF-07 }, adjust: { family_name: { set: PLC modules }, business_unit: { set: Industrial Controls }, unit_price_usd: { set: 520 }, std_unit_cost_usd: { set: 296 } } }
      - { id: P-MFG-49, description: "PF-08 Variable-speed drives (Industrial Controls)", where: { family_id: PF-08 }, adjust: { family_name: { set: Variable-speed drives }, business_unit: { set: Industrial Controls }, unit_price_usd: { set: 1150 }, std_unit_cost_usd: { set: 702 } } }
      - { id: P-MFG-50, description: "PF-09 HMI panels (Industrial Controls)", where: { family_id: PF-09 }, adjust: { family_name: { set: HMI panels }, business_unit: { set: Industrial Controls }, unit_price_usd: { set: 780 }, std_unit_cost_usd: { set: 455 } } }
      - { id: P-MFG-51, description: "PF-10 Actuator housings (Aerospace Components)", where: { family_id: PF-10 }, adjust: { family_name: { set: Actuator housings }, business_unit: { set: Aerospace Components }, unit_price_usd: { set: 4800 }, std_unit_cost_usd: { set: 3150 } } }
      - { id: P-MFG-52, description: "PF-11 Landing gear fittings (Aerospace Components)", where: { family_id: PF-11 }, adjust: { family_name: { set: Landing gear fittings }, business_unit: { set: Aerospace Components }, unit_price_usd: { set: 9400 }, std_unit_cost_usd: { set: 6020 } } }
      - { id: P-MFG-53, description: "PF-12 Turbine brackets (Aerospace Components)", where: { family_id: PF-12 }, adjust: { family_name: { set: Turbine brackets }, business_unit: { set: Aerospace Components }, unit_price_usd: { set: 2100 }, std_unit_cost_usd: { set: 1330 } } }

  - name: ERP_SALES_ORDER_LINE
    system: ERP sales and distribution
    description: Distributor sales order lines with promise date, days early or late at proof of delivery, quantities and value
    key: order_line_id
    rows: { S: 6000, M: 60000, L: 300000 }
    loaded_at_from: order_date
    cdc_noise: { duplicate_updates_pct: 4, deletes_pct: 0.4, dirty_strings_pct: 3, late_arrivals_pct: 1 }
    columns:
      - { name: order_line_id, type: VARCHAR, gen: { seq: { prefix: "SOL-", pad: 8 } } }
      - { name: distributor_id, type: VARCHAR, gen: { fk: { table: CRM_DISTRIBUTOR, column: distributor_id, dist: zipf, s: 0.6 } } }
      - { name: family_id, type: VARCHAR, gen: { fk: { table: MDM_PRODUCT_FAMILY, column: family_id } } }
      - { name: business_unit, type: VARCHAR, gen: { derive_from: { fk_column: family_id, parent_column: business_unit } } }
      - { name: unit_price_usd, type: DOUBLE, gen: { derive_from: { fk_column: family_id, parent_column: unit_price_usd } } }
      - { name: std_unit_cost_usd, type: DOUBLE, gen: { derive_from: { fk_column: family_id, parent_column: std_unit_cost_usd } }, tags: [TRADE_SECRET] }
      - { name: order_date, type: DATE, gen: { date: { from: "2024-12-01", to: "2026-09-25" } } }
      - { name: promised_date, type: DATE, gen: { date_offset: { from_column: order_date, days: { min: 8, max: 35 } } } }
      - { name: delay_days, type: INTEGER, gen: { choice: { values: [-3, -1, 0, 1, 2, 5, 10], weights: [10, 16, 63, 4, 3, 2, 2] } } }
      - { name: qty_ordered, type: INTEGER, gen: { lognormal: { mu: 3.0, sigma: 0.8, min: 1, max: 2000 } } }
      - { name: fill_pct, type: INTEGER, gen: { choice: { values: [100, 96, 90, 80], weights: [94, 3, 2, 1] } } }
      - { name: qty_shipped, type: INTEGER, gen: { formula: "round(qty_ordered * fill_pct / 100)" } }
    plant:
      - id: P-MFG-54
        description: "Aerospace Components deliveries slip in July and August 2026 while heat-treat capacity is down — the on-time delivery dip"
        where: { business_unit: Aerospace Components }
        window: { column: order_date, from: "2026-06-15", to: "2026-08-20" }
        adjust: { delay_days: { add: 6, pct: 30 } }

  - name: ERP_MATERIAL
    system: ERP materials management
    description: Material master with class, status, ABC class, unit cost and safety stock cover
    key: material_id
    rows: { S: 1500, M: 1500, L: 1500 }
    cdc_noise: { duplicate_updates_pct: 2, dirty_strings_pct: 3 }
    columns:
      - { name: material_id, type: VARCHAR, gen: { seq: { prefix: "MAT-", pad: 5 } } }
      - { name: material_class, type: VARCHAR, gen: { choice: { values: [Raw material, Purchased component, Work in progress, Finished goods, MRO spare], weights: [22, 30, 14, 20, 14] } } }
      - { name: material_status, type: VARCHAR, gen: { choice: { values: [Active, Obsolete], weights: [91, 9] } } }
      - { name: abc_class, type: VARCHAR, gen: { choice: { values: [A, B, C], weights: [15, 30, 55] } } }
      - { name: unit_cost_usd, type: DOUBLE, gen: { lognormal: { mu: 3.0, sigma: 1.1, min: 0.05, max: 25000, decimals: 2 } } }
      - { name: safety_stock_days, type: INTEGER, gen: { uniform: { min: 5, max: 20 } } }

  - name: ERP_INVENTORY_SNAPSHOT
    system: ERP materials management
    description: Daily material-plant inventory positions sampled from the ERP stock ledger
    key: snapshot_id
    rows: { S: 8000, M: 60000, L: 300000 }
    loaded_at_from: snapshot_date
    cdc_noise: { duplicate_updates_pct: 2, late_arrivals_pct: 2, dirty_strings_pct: 2 }
    columns:
      - { name: snapshot_id, type: VARCHAR, gen: { seq: { prefix: "INV-", pad: 9 } } }
      - { name: material_id, type: VARCHAR, gen: { fk: { table: ERP_MATERIAL, column: material_id } } }
      - { name: material_class, type: VARCHAR, gen: { derive_from: { fk_column: material_id, parent_column: material_class } } }
      - { name: material_status, type: VARCHAR, gen: { derive_from: { fk_column: material_id, parent_column: material_status } } }
      - { name: abc_class, type: VARCHAR, gen: { derive_from: { fk_column: material_id, parent_column: abc_class } } }
      - { name: unit_cost_usd, type: DOUBLE, gen: { derive_from: { fk_column: material_id, parent_column: unit_cost_usd } } }
      - { name: safety_stock_days, type: INTEGER, gen: { derive_from: { fk_column: material_id, parent_column: safety_stock_days } } }
      - { name: plant_id, type: VARCHAR, gen: { fk: { table: MDM_PLANT, column: plant_id } } }
      - { name: business_unit, type: VARCHAR, gen: { derive_from: { fk_column: plant_id, parent_column: business_unit } } }
      - { name: snapshot_date, type: DATE, gen: { date: { from: "2026-01-01", to: asOf } } }
      - { name: daily_usage_qty, type: DOUBLE, gen: { lognormal: { mu: 2.5, sigma: 0.9, min: 0.1, max: 5000, decimals: 1 } } }
      - { name: cover_days, type: DOUBLE, gen: { lognormal: { mu: 3.15, sigma: 0.55, min: 1, max: 365, decimals: 1 } } }
      - { name: stockout_draw, type: DOUBLE, gen: { uniform: { min: 0, max: 100, decimals: 2 } } }
      - { name: on_hand_qty, type: DOUBLE, gen: { formula: "if(stockout_draw < 2.5, 0, round(daily_usage_qty * cover_days))" } }
    plant:
      - id: P-MFG-55
        description: "Obsolete materials sit in stock with no usage — BR-MFG-020 keeps them out of cover, turns and stockout metrics unless asked"
        where: { material_status: Obsolete }
        adjust: { daily_usage_qty: { set: 0 }, on_hand_qty: { multiply: 4 } }
      - id: P-MFG-56
        description: "MRO spares are held for breakdown cover — two and a half times the stock of production materials"
        where: { material_class: MRO spare }
        adjust: { on_hand_qty: { multiply: 2.5 } }
      - id: P-MFG-57
        description: "Plant PL-09 Dunmore Flats runs out of purchased components in September 2026 after a carrier failure"
        where: { plant_id: PL-09 }
        window: { column: snapshot_date, from: "2026-09-01", to: "2026-09-30" }
        adjust: { on_hand_qty: { set: 0, pct: 18 } }

  - name: SVC_WARRANTY_LOT
    system: Service & warranty management
    description: Shipped lots per product family tracked for field warranty claims, failure mode and claim cost
    key: lot_id
    rows: { S: 2000, M: 12000, L: 60000 }
    loaded_at_from: ship_date
    cdc_noise: { duplicate_updates_pct: 3, dirty_strings_pct: 3 }
    columns:
      - { name: lot_id, type: VARCHAR, gen: { seq: { prefix: "WL-", pad: 7 } } }
      - { name: family_id, type: VARCHAR, gen: { fk: { table: MDM_PRODUCT_FAMILY, column: family_id } } }
      - { name: business_unit, type: VARCHAR, gen: { derive_from: { fk_column: family_id, parent_column: business_unit } } }
      - { name: ship_date, type: DATE, gen: { date: { from: "2025-01-01", to: asOf } } }
      - { name: units_shipped, type: INTEGER, gen: { lognormal: { mu: 5.0, sigma: 0.8, min: 10, max: 20000 } } }
      - { name: claim_per_mille, type: DOUBLE, gen: { lognormal: { mu: 1.2, sigma: 0.6, min: 0, max: 80, decimals: 3 } } }
      - { name: claim_draw, type: DOUBLE, gen: { uniform: { min: 0, max: 1, decimals: 4 } } }
      - { name: claims, type: INTEGER, gen: { formula: "floor(units_shipped * claim_per_mille / 1000 + claim_draw)" } }
      - { name: cost_per_claim_usd, type: DOUBLE, gen: { lognormal: { mu: 6.2, sigma: 0.5, min: 40, max: 40000, decimals: 2 } } }
      - { name: claim_cost_usd, type: DOUBLE, gen: { formula: "claims * cost_per_claim_usd", decimals: 2 } }
      - { name: top_failure_mode, type: VARCHAR, gen: { choice: { values: [Seal leak, Bearing wear, Electrical fault, Firmware fault, Corrosion, Fastener loosening], weights: [16, 20, 18, 14, 16, 16] } } }
    plant:
      - id: P-MFG-58
        description: "PF-04 Hydraulic pumps have a seal compound problem — the highest warranty claim rate, mostly seal leaks"
        where: { family_id: PF-04 }
        adjust: { claims: { multiply: 3 }, claim_cost_usd: { multiply: 3 }, top_failure_mode: { set: Seal leak, pct: 70 } }

  - name: EHS_INCIDENT
    system: Environment, health & safety (EHS)
    description: Safety incidents and near misses by plant with severity and the person involved
    key: incident_id
    rows: { S: 1200, M: 1600, L: 1600 }
    loaded_at_from: incident_date
    cdc_noise: { duplicate_updates_pct: 3, dirty_strings_pct: 4 }
    columns:
      - { name: incident_id, type: VARCHAR, gen: { seq: { prefix: "EHS-", pad: 6 } } }
      - { name: plant_id, type: VARCHAR, gen: { fk: { table: MDM_PLANT, column: plant_id } } }
      - { name: business_unit, type: VARCHAR, gen: { derive_from: { fk_column: plant_id, parent_column: business_unit } } }
      - { name: incident_date, type: DATE, gen: { date: { from: "2025-01-01", to: asOf } } }
      - { name: severity, type: VARCHAR, gen: { choice: { values: [Near miss, First aid, Recordable, Lost time], weights: [58, 26, 12, 4] } } }
      - { name: injured_person, type: VARCHAR, gen: { person: full }, tags: [PII] }
      - { name: description, type: VARCHAR, gen: { template: "{severity} reported at {plant_id}" } }
    plant:
      - id: P-MFG-59
        description: "PL-20 Oakhurst has a run of recordable hand injuries at the forging press — the highest TRIR"
        where: { plant_id: PL-20 }
        adjust: { severity: { set: Recordable, pct: 45 } }
