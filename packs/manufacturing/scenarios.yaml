# ================================================================ AG-MFG-005 Data Steward Assistant (no semantic views)
- id: SC-MFG-025
  agent: AG-MFG-005
  pattern: 15
  question: "What can you answer?"
  paraphrases:
    - "What can you help me with?"
    - "help"
  kind: help
  query: null
  answer:
    headline: "I explain governance across the manufacturing data estate — I don't analyse business KPIs."
    narrative: "Ask me what a glossary term or metric means, the certification status of a data product, or where governance gaps such as missing stewards or masking sit. For KPI numbers, ask the domain agents."
    chart: none
  followups: ["Which products are not yet certified?", "How is OEE defined?", "Which critical data elements lack a quality rule?"]

- id: SC-MFG-026
  agent: AG-MFG-005
  pattern: 15
  question: "Certify the Order to Delivery product for me."
  paraphrases:
    - "Publish DP-MFG-005 to the marketplace"
    - "Can you approve my access request?"
  kind: decline
  query: null
  answer:
    headline: "I can't certify or publish products — agents act, humans decide."
    narrative: "Certification is decided by the governance council at gate 11 and access by the product's steward through the access workflow. I can show you which certification checks are still open and who must approve them."
    chart: none
  followups: ["What is the certification status of Order to Delivery?", "Who can approve access to Order to Delivery?"]
