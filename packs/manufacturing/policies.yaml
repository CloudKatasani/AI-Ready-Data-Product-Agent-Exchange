    products: [DP-MFG-001, DP-MFG-002, DP-MFG-003, DP-MFG-004, DP-MFG-005, DP-MFG-006]
    agents: [AG-MFG-001, AG-MFG-002, AG-MFG-003, AG-MFG-004]

public_products: []
