# Harbor & Pine synonyms (synthetic): retail jargon → governed metric, dimension, value or glossary term.

# ── Sales ───────────────────────────────────────────────────────────────────────────────────────────
- term: Net sales
  synonyms: [sales, revenue, takings, top line, comp sales, like-for-like sales]
  maps_to: { kind: metric, ref: net_sales }
- term: Gross margin rate
  synonyms: [margin rate, gm rate, gross margin percent, margin percentage]
  maps_to: { kind: metric, ref: gross_margin_pct }
- term: Gross margin
  synonyms: [margin dollars, gross profit, gm dollars]
  maps_to: { kind: metric, ref: gross_margin }
- term: Units sold
  synonyms: [unit sales, volume sold, units moved]
  maps_to: { kind: metric, ref: units_sold }
- term: Sales transactions
  synonyms: [baskets, tickets, checkouts, footfall conversions]
  maps_to: { kind: metric, ref: transactions }
- term: Average basket value
  synonyms: [basket size, average ticket, atv, spend per visit]
  maps_to: { kind: metric, ref: avg_basket_value }
- term: Promotional sales share
  synonyms: [promo share, promo mix, sales on deal]
  maps_to: { kind: metric, ref: promo_sales_share }
- term: Digital sales share
  synonyms: [digital penetration, ecommerce share, online penetration]
  maps_to: { kind: metric, ref: digital_sales_share }
- term: Comparable store
  synonyms: [comp stores, like for like stores, lfl stores]
  maps_to: { kind: dimension, ref: comp_store }
- term: Store
  synonyms: [shops, locations, branches, doors]
  maps_to: { kind: dimension, ref: store }
- term: Department
  synonyms: [dept, merchandise division]
  maps_to: { kind: dimension, ref: department }
- term: Channel
  synonyms: [sales channel, how customers bought]
  maps_to: { kind: dimension, ref: channel }
- term: Click & collect
  synonyms: [bopis, buy online pick up in store, click and collect]
  maps_to: { kind: value, ref: channel=Click & collect }
- term: Region
  synonyms: [territory, store region, market area, district]
  maps_to: { kind: dimension, ref: region }
- term: Northeast
  synonyms: [north east region, northeast stores]
  maps_to: { kind: value, ref: region=Northeast }
- term: Southwest
  synonyms: [south west region, southwest stores]
  maps_to: { kind: value, ref: region=Southwest }

