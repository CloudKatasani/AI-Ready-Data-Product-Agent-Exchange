name: SALES_PERFORMANCE
description: Store and digital sales at line grain with stores, items, channels and comparable-store status
tables:
  - { alias: s, fqn: CONFORMED_GOLD.FCT_SALES_LINE, pk: sales_line_key }
  - { alias: st, fqn: CONFORMED_GOLD.DIM_STORE, pk: store_key }
  - { alias: i, fqn: CONFORMED_GOLD.DIM_ITEM, pk: item_key }
  - { alias: d, fqn: CONFORMED_GOLD.DIM_DATE, pk: date_key }
relationships:
  - { from: s.store_key, to: st.store_key }
  - { from: s.item_key, to: i.item_key }
  - { from: s.date_key, to: d.date_key }
dimensions:
  - { name: region, expr: st.region, label: Region, synonyms: [territory, store region, area], term: GT-RTL-REGION }
  - { name: store, expr: st.store_id, label: Store, synonyms: [shop, location, stores], term: GT-RTL-STORE }
  - { name: store_format, expr: st.store_format, label: Store format, synonyms: [format, store type] }
  - { name: comp_store, expr: st.comp_store, label: Comparable store, synonyms: [comp, like for like, comparable], term: GT-RTL-COMP-STORE }
  - { name: department, expr: i.department, label: Department, synonyms: [dept, division], term: GT-RTL-DEPARTMENT }
  - { name: category, expr: i.category, label: Category, synonyms: [merchandise category, product category], term: GT-RTL-CATEGORY }
  - { name: brand_type, expr: i.brand_type, label: Brand type, synonyms: [own brand, private label or national] }
  - { name: channel, expr: s.channel, label: Channel, synonyms: [sales channel, store or online], term: GT-RTL-CHANNEL }
  - { name: on_promo, expr: s.on_promo, label: On promotion, synonyms: [promoted, promo] }
time_dimensions:
  - { name: sale_date, expr: d.date, default: true }
facts:
  - { name: net_amount, expr: s.net_amount, description: Net sales amount per line after discounts }
  - { name: cost_amount, expr: s.cost_amount, description: Cost of goods sold per line }
  - { name: quantity, expr: s.quantity, description: Units sold per line }
metrics:
  - name: net_sales
    label: Net sales
    expr: SUM(s.net_amount)
    unit: USD
    decimals: 0
    direction: higher_is_better
    synonyms: [sales, revenue, takings, turnover, comp sales]
    term: GT-RTL-NET-SALES
    description: Sales after discounts, excluding tax, on comparable stores unless all stores are requested
    default_filters: [ { rule: BR-RTL-012 } ]
    naive_expr: SUM(s.gross_amount)
  - name: gross_margin_pct
    label: Gross margin rate
    expr: 100.0 * SUM(s.net_amount - s.cost_amount) / SUM(s.net_amount)
    unit: '%'
    decimals: 1
    direction: higher_is_better
    synonyms: [margin rate, gross margin percent, gm rate, gm%]
    term: GT-RTL-GROSS-MARGIN
    description: Net sales less cost of goods sold, as a share of net sales
    default_filters: [ { rule: BR-RTL-012 } ]
    naive_expr: AVG(i.initial_margin_pct)
  - name: gross_margin
    label: Gross margin
    expr: SUM(s.net_amount - s.cost_amount)
    unit: USD
    decimals: 0
    direction: higher_is_better
    synonyms: [margin dollars, gross profit]
    term: GT-RTL-GROSS-MARGIN
    description: Net sales less cost of goods sold
    default_filters: [ { rule: BR-RTL-012 } ]
  - name: units_sold
    label: Units sold
    expr: SUM(s.quantity)
    unit: units
    decimals: 0
    direction: higher_is_better
    synonyms: [units, volume, unit sales]
    term: GT-RTL-UNITS
    description: Units sold on sales lines
    default_filters: [ { rule: BR-RTL-012 } ]
  - name: transactions
    label: Sales transactions
    expr: COUNT(DISTINCT s.txn_id)
    unit: transactions
    decimals: 0
    direction: higher_is_better
    synonyms: [baskets, tickets, number of transactions]
    term: GT-RTL-TRANSACTION
    description: Distinct till and web-store transactions
    default_filters: [ { rule: BR-RTL-012 } ]
  - name: avg_basket_value
    label: Average basket value
    expr: SUM(s.net_amount) / COUNT(DISTINCT s.txn_id)
    unit: USD
    decimals: 2
    direction: higher_is_better
    synonyms: [basket size, average transaction value, atv, average ticket]
    term: GT-RTL-BASKET
    description: Net sales per transaction
    default_filters: [ { rule: BR-RTL-012 } ]
    naive_expr: AVG(s.net_amount)
  - name: promo_sales_share
    label: Promotional sales share
    expr: 100.0 * SUM(CASE WHEN s.on_promo THEN s.net_amount ELSE 0 END) / SUM(s.net_amount)
    unit: '%'
    decimals: 1
    direction: neutral
    synonyms: [promo share, promotional mix, sales on promotion]
    term: GT-RTL-PROMO-SALES
    description: Share of net sales sold at a promotional or markdown price
    default_filters: [ { rule: BR-RTL-012 } ]
  - name: digital_sales_share
    label: Digital sales share
    expr: 100.0 * SUM(CASE WHEN s.channel <> 'In-store' THEN s.net_amount ELSE 0 END) / SUM(s.net_amount)
    unit: '%'
    decimals: 1
    direction: higher_is_better
    synonyms: [digital penetration, online share, ecommerce share]
    term: GT-RTL-CHANNEL
    description: Share of net sales placed online, including click & collect
    default_filters: [ { rule: BR-RTL-012 } ]
  - name: member_sales_share
    label: Loyalty-identified sales share
    expr: 100.0 * SUM(CASE WHEN s.member_identified THEN s.net_amount ELSE 0 END) / SUM(s.net_amount)
    unit: '%'
    decimals: 1
    direction: higher_is_better
    synonyms: [member sales share, identified sales, loyalty penetration]
    term: GT-RTL-MEMBER-SALES
    description: Share of net sales where a loyalty member was identified at checkout
    default_filters: [ { rule: BR-RTL-012 } ]
products: [DP-RTL-002]
