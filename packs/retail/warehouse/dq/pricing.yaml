# Price change DQ rules.
- id: DQ-RTL-048
  object: CONFORMED_GOLD.FCT_PRICE_CHANGE
  column: executed_date
  dimension: timeliness
  assertion: "freshness_min <= 2880"
  severity: medium
  alert_route: engineering
  description: Price change executions from store devices are no more than a day behind.
- id: DQ-RTL-049
  object: CONFORMED_GOLD.FCT_PRICE_CHANGE
  column: change_type
  dimension: consistency
  assertion: "invalid_rate == 0"
  allowed: [Markdown, Promotion, Permanent]
  severity: medium
  alert_route: steward
  description: Price changes are markdown, promotion or permanent.
- id: DQ-RTL-050
  object: CONFORMED_GOLD.FCT_PRICE_CHANGE
  column: change_id
  dimension: uniqueness
  assertion: "dup_rate == 0"
  severity: medium
  alert_route: engineering
  description: One row per price change.
- id: DQ-RTL-051
  object: CONFORMED_GOLD.FCT_PRICE_CHANGE
  column: effective_date
  dimension: completeness
  assertion: "null_rate == 0"
  severity: high
  alert_route: steward
  description: Every price change has an effective date.
- id: DQ-RTL-052
  object: CONFORMED_GOLD.FCT_PRICE_CHANGE
  column: markdown_pct
  dimension: validity
  assertion: "invalid_rate == 0"
  allowed: [10, 20, 25, 30, 40, 50]
  severity: low
  alert_route: steward
  description: Markdown steps follow the pricing ladder.
