sensitivity_classes:
  - { class: PII, description: "Personal information about constituents, applicants, callers and staff" }
  - { class: GOV_ID, description: "Government identifiers captured at intake and vendor tax identifiers" }

masking_policies:
  - { id: MASK_PII, class: PII, macro: mask_pii, description: "Replace personal data with ••• unless the persona is cleared for PII" }
  - { id: MASK_EMAIL, class: PII, macro: mask_email, description: "Hash the local part of email addresses" }
  - { id: MASK_PHONE, class: PII, macro: mask_phone, description: "Show only the last four digits of phone numbers" }
  - { id: MASK_GOV_ID, class: GOV_ID, macro: mask_gov_id, description: "Show only the last four characters of government and tax identifiers" }

row_access_policies:
  - id: RAP_DISTRICT
    dimension: region
    description: "District-based personas see only rows for their own service districts"
    bindings:
      - { object: CONFORMED_GOLD.DIM_OFFICE, column: region }
      - { object: CONFORMED_GOLD.DIM_CONSTITUENT, column: region }
      - { object: CONFORMED_GOLD.FCT_SERVICE_REQUEST, column: region }
      - { object: CONFORMED_GOLD.FCT_PAYMENT, column: region }
      - { object: CONFORMED_GOLD.FCT_PERMIT, column: region }
      - { object: CONFORMED_GOLD.FCT_WORK_ORDER, column: region }
      - { object: CONFORMED_GOLD.FCT_CASE, column: region }
      - { object: CONFORMED_GOLD.FCT_APPLICATION, column: region }
      - { object: CURATED_SILVER.CONSTITUENT, column: region }
      - { object: CURATED_SILVER.CASE_RECORD, column: region }
      - { object: CURATED_SILVER.BENEFIT_APPLICATION, column: region }
      - { object: CURATED_SILVER.SERVICE_REQUEST, column: region }

column_tags:
  # Constituent PII and government identifiers — masked for every persona without clearance.
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.first_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.last_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.full_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.email, classes: [PII], masking: MASK_EMAIL }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.phone, classes: [PII], masking: MASK_PHONE }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.street_address, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.gov_id, classes: [GOV_ID], masking: MASK_GOV_ID }
  # Certification demo (DP-PUB-006 gate 6): the case head's identifier on the payment fact is not masked until FIX-2.
  - { column: CONFORMED_GOLD.FCT_PAYMENT.case_gov_id, classes: [GOV_ID], masking: MASK_GOV_ID, mask_pending_fix: FIX-2 }
  - { column: CONFORMED_GOLD.FCT_CASE.caseworker_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.FCT_SERVICE_REQUEST.caller_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.FCT_PERMIT.applicant_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.FCT_PERMIT.applicant_email, classes: [PII], masking: MASK_EMAIL }
  - { column: CONFORMED_GOLD.FCT_WORK_ORDER.crew_lead, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.FCT_PO_SPEND.buyer, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.FCT_POSITION.incumbent_name, classes: [PII], masking: MASK_PII }
  - { column: CONFORMED_GOLD.DIM_VENDOR.tax_id, classes: [GOV_ID], masking: MASK_GOV_ID }
  - { column: CONFORMED_GOLD.DIM_VENDOR.contact_email, classes: [PII], masking: MASK_EMAIL }
  - { column: CURATED_SILVER.CONSTITUENT.first_name, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.CONSTITUENT.last_name, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.CONSTITUENT.email, classes: [PII], masking: MASK_EMAIL }
  - { column: CURATED_SILVER.CONSTITUENT.phone, classes: [PII], masking: MASK_PHONE }
  - { column: CURATED_SILVER.CONSTITUENT.street_address, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.CONSTITUENT.gov_id, classes: [GOV_ID], masking: MASK_GOV_ID }
  - { column: CURATED_SILVER.CASE_RECORD.caseworker_name, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.SERVICE_REQUEST.caller_name, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.PERMIT_APPLICATION.applicant_name, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.PERMIT_APPLICATION.applicant_email, classes: [PII], masking: MASK_EMAIL }
  - { column: CURATED_SILVER.PERMIT_INSPECTION.inspector_name, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.STREET_WORK_ORDER.crew_lead, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.PURCHASE_ORDER_LINE.buyer, classes: [PII], masking: MASK_PII }
  - { column: CURATED_SILVER.VENDOR_MASTER.tax_id, classes: [GOV_ID], masking: MASK_GOV_ID }
  - { column: CURATED_SILVER.VENDOR_MASTER.contact_email, classes: [PII], masking: MASK_EMAIL }
  - { column: CURATED_SILVER.STAFF_POSITION.incumbent_name, classes: [PII], masking: MASK_PII }
  # Critical data elements (each has DQ rules in warehouse/dq).
  - { column: CONFORMED_GOLD.FCT_APPLICATION.processing_days, cde: true }
  - { column: CONFORMED_GOLD.FCT_APPLICATION.docs_hold, cde: true }
  - { column: CONFORMED_GOLD.FCT_APPLICATION.complete_date, cde: true }
  - { column: CONFORMED_GOLD.FCT_APPLICATION.decision, cde: true }
  - { column: CONFORMED_GOLD.FCT_CASE.pending_action, cde: true }
  - { column: CONFORMED_GOLD.DIM_OFFICE.region, cde: true }
  - { column: CONFORMED_GOLD.DIM_OFFICE.caseworkers, cde: true }
  - { column: CONFORMED_GOLD.FCT_PAYMENT.payment_amount, cde: true }
  - { column: CONFORMED_GOLD.FCT_PAYMENT.improper_amount, cde: true }
  - { column: CONFORMED_GOLD.FCT_PAYMENT.flag_status, cde: true }
  - { column: CONFORMED_GOLD.FCT_SERVICE_REQUEST.resolution_days, cde: true }
  - { column: CONFORMED_GOLD.FCT_SERVICE_REQUEST.sla_days, cde: true }
  - { column: CONFORMED_GOLD.FCT_PERMIT.review_days, cde: true }
  - { column: CONFORMED_GOLD.FCT_WORK_ORDER.repair_days, cde: true }
  - { column: CONFORMED_GOLD.FCT_BUDGET.budget_amount, cde: true }
  - { column: CONFORMED_GOLD.FCT_BUDGET.actual_amount, cde: true }
  - { column: CONFORMED_GOLD.FCT_PO_SPEND.spend_usd, cde: true }
  - { column: CONFORMED_GOLD.FCT_PO_SPEND.cycle_days, cde: true }
  - { column: CONFORMED_GOLD.FCT_GRANT.drawn_amount, cde: true }
  - { column: CONFORMED_GOLD.DIM_CONSTITUENT.constituent_id, cde: true }

grants:
  - persona: public-sector:caseworker-analyst
    products: [DP-PUB-001, DP-PUB-002, DP-PUB-003, DP-PUB-004]
    agents: [AG-PUB-001, AG-PUB-002, AG-PUB-003]
  - persona: public-sector:program-ops
    products: [DP-PUB-001, DP-PUB-002, DP-PUB-003, DP-PUB-004, DP-PUB-005, DP-PUB-007]
    agents: [AG-PUB-001, AG-PUB-002, AG-PUB-003, AG-PUB-004]
  - persona: public-sector:hs-dpo
