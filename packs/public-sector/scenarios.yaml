  kind: answer
  query: { view: PERMITTING, metrics: [total_valuation], dimensions: [applicant_name], timeRange: { ytd: true }, orderBy: [{ field: total_valuation, dir: desc }], limit: 5, analysis: rank }
  answer:
    headline: "The largest permit applicant this year declared {{top.total_valuation}} of construction."
    narrative: "Applicant names are masked unless your persona is cleared for PII under MASK_PII (BR-PUB-023). Showing the top {{rows}} applicants by declared valuation."
