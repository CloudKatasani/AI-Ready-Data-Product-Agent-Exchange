    narrative: "\"Fix a pothole\" maps to pothole repair time — days from a pothole report to closure of the 311 request. {{bottom.region}} is fastest at {{bottom.pothole_repair_days}} days; the 311 SLA for potholes is 5 days (BR-PUB-006)."
