# Scripted scenarios for Westland County Services — ported from the AI-Ready public-sector `scenarios.ts` (S-01..S-15)
# and extended to permits, public works and finance. Numbers come from golden.json; `expect` holds shape assertions
# only. Together the 28 scenarios cover all 15 patterns (04 §6).

# ================================================================ AG-PUB-002 Program Analyst
- id: SC-PUB-001
  agent: AG-PUB-002
  pattern: 3
  question: "What was average benefit processing time by district last quarter?"
  paraphrases:
    - "What was average benefit processing time by district last quarter, excluding applications on hold for documents?"
    - "benefit processing days per district last qtr"
  kind: answer
  query: { view: CASE_PROCESSING, metrics: [avg_processing_days], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: avg_processing_days, dir: desc }] }
  answer:
    headline: "{{top.region}} had the slowest benefit processing last quarter at {{top.avg_processing_days}} business days."
    narrative: "Business days from a complete application to decision, excluding applications on hold for documents (BR-PUB-002). {{bottom.region}} was fastest at {{bottom.avg_processing_days}} days across {{rows}} districts; the county average was {{total.avg_processing_days}} days."
    chart: bar
  followups: ["Include applications on hold for documents", "Which offices drove Riverside?", "Is the timely processing rate within target this year?"]
  expect: { rows: 4, top: { region: Riverside }, rules: [BR-PUB-002] }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-PUB-002
  agent: AG-PUB-002
  pattern: 10
  question: "What was average benefit processing time by district last quarter, including applications on hold for documents?"
  paraphrases:
    - "benefit processing time per district last quarter including document holds"
  kind: answer
  query: { view: CASE_PROCESSING, metrics: [avg_processing_days], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: avg_processing_days, dir: desc }] }
  answer:
    headline: "Including document holds, {{top.region}} had the slowest benefit processing last quarter at {{top.avg_processing_days}} business days."
    narrative: "You asked to include applications on hold for documents, so BR-PUB-002 is not applied. North's new income-verification checklist put far more applications on hold — compare with the standard measure, which excludes them."
    chart: bar
  followups: ["Exclude applications on hold for documents", "How many applications were over the 30-day standard?"]
  expect: { rows: 4, top: { region: North } }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-PUB-003
  agent: AG-PUB-002
  pattern: 2
  question: "Is the timely processing rate within target this year?"
  paraphrases:
    - "Are we meeting the 30-day processing standard this year?"
    - "timely processing rate vs target ytd"
  kind: answer
  query: { view: CASE_PROCESSING, metrics: [timely_processing_rate], timeRange: { ytd: true }, analysis: compare_target }
  answer:
    headline: "The timely processing rate is {{top.timely_processing_rate}}% this year — {{vsTarget.top}} the target band."
    narrative: "Decided applications decided within 30 business days of a complete application, excluding applications on hold for documents (BR-PUB-002, BR-PUB-003)."
    chart: kpi
  followups: ["Timely processing rate by district last quarter", "How many applications were over the 30-day standard?"]
  expect: { rows: 1, rules: [BR-PUB-002] }

- id: SC-PUB-004
  agent: AG-PUB-002
  pattern: 5
  question: "Which five offices have the largest case backlog?"
  paraphrases:
    - "Top 5 offices by case backlog"
    - "offices with the most cases awaiting a decision"
  kind: answer
  query: { view: CASELOAD, metrics: [case_backlog], dimensions: [office], orderBy: [{ field: case_backlog, dir: desc }], limit: 5, analysis: rank }
  answer:
    headline: "{{top.office}} has the largest case backlog with {{top.case_backlog}} cases awaiting a caseworker decision."
    narrative: "Open cases with a new application, renewal or change report waiting at the reporting date (BR-PUB-013); showing the top {{rows}} offices. The county backlog is {{total.case_backlog}} cases."
    chart: bar
  followups: ["Backlog age by district", "Average caseload by office"]
  expect: { rows: 5, top: { office: Mill Creek Office } }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-PUB-005
  agent: AG-PUB-002
  pattern: 9
  question: "How does benefit processing time compare across programs this year?"
  paraphrases:
    - "Compare processing time by benefit program year to date"
  kind: answer
  query: { view: CASE_PROCESSING, metrics: [avg_processing_days, timely_processing_rate], dimensions: [program], timeRange: { ytd: true }, orderBy: [{ field: avg_processing_days, dir: desc }] }
  answer:
    headline: "{{top.program}} takes longest to decide this year at {{top.avg_processing_days}} business days."
    narrative: "{{top.timely_processing_rate}}% of {{top.program}} decisions met the 30-day standard, versus {{bottom.timely_processing_rate}}% for {{bottom.program}} ({{bottom.avg_processing_days}} days). Document holds are excluded (BR-PUB-002)."
    chart: bar
  followups: ["Approval rate by program this year", "Processing time by office last quarter"]
  expect: { rows: 5, rules: [BR-PUB-002] }

- id: SC-PUB-006
  agent: AG-PUB-002
  pattern: 13
  question: "How large is the case backlog in each district?"
  paraphrases:
    - "case backlog per district"
  kind: answer
  query: { view: CASELOAD, metrics: [case_backlog, backlog_age_days], dimensions: [region], orderBy: [{ field: case_backlog, dir: desc }] }
  answer:
    headline: "{{top.region}} carries the largest case backlog with {{top.case_backlog}} cases, waiting {{top.backlog_age_days}} days on average."
    narrative: "Backlog by service district for the districts you are entitled to see; the district row access policy RAP_DISTRICT applies to district-based personas."
    chart: bar
  followups: ["Which five offices have the largest case backlog?", "Average caseload by district"]
  expect: { rows: 4, top: { region: Riverside } }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-PUB-007
  agent: AG-PUB-002
  pattern: 15
  question: "Approve the pending benefit application in my queue."
  paraphrases:
    - "Deny this application for me"
    - "Make the eligibility decision on the next application"
  kind: decline
  query: null
  answer:
    headline: "I can't decide applications — eligibility decisions are made by a caseworker."
    narrative: "Agents act, humans decide: approving or denying an application is a caseworker decision that can be appealed (BR-PUB-028). I can show you processing time and the backlog for your office so you can prioritise the queue."
    chart: none
  followups: ["Which five offices have the largest case backlog?", "What was average benefit processing time by district last quarter?"]

# ================================================================ AG-PUB-001 Constituent Services Assistant
- id: SC-PUB-008
  agent: AG-PUB-001
  pattern: 4
  question: "How has 311 resolution time trended month by month this year?"
  paraphrases:
    - "Monthly 311 resolution time year to date"
    - "311 time to close trend by month this year"
  kind: answer
  query: { view: SERVICE_REQUESTS, metrics: [avg_resolution_days], timeGrain: month, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "311 resolution time averaged {{total.avg_resolution_days}} days this year — {{vsTarget.total}} the target band."
    narrative: "Monthly mean days from creation to closure over {{rows}} months, excluding merged duplicates (BR-PUB-005)."
    chart: line
  followups: ["311 resolution time by district last quarter", "How has 311 SLA attainment changed quarter over quarter this year?"]
  expect: { rows: 9, rules: [BR-PUB-005] }

