# ================================================================ AG-PUB-003 Payment Integrity Copilot
- id: SC-PUB-016
  agent: AG-PUB-003
  pattern: 1
  question: "What is the improper payment rate year to date?"
  paraphrases:
    - "improper payment rate ytd"
  kind: answer
  query: { view: BENEFIT_PAYMENTS, metrics: [improper_payment_rate], timeRange: { ytd: true }, analysis: value }
  answer:
    headline: "The improper payment rate is {{top.improper_payment_rate}}% year to date — {{vsTarget.top}} the target band."
    narrative: "Improper dollars (over- and underpayments) as a share of dollars issued, excluding voided payments (BR-PUB-008, BR-PUB-009)."
    chart: kpi
  followups: ["What is driving improper payment dollars this year, by error type?", "Improper payment rate by program this year"]
  expect: { rows: 1, rules: [BR-PUB-008] }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-PUB-017
  agent: AG-PUB-003
  pattern: 6
  question: "What is driving improper payment dollars this year, by error type?"
  paraphrases:
    - "Which QC error types contribute most to improper payments this year?"
    - "improper dollars by error cause ytd"
  kind: answer
  query: { view: BENEFIT_PAYMENTS, metrics: [improper_payment_amount], dimensions: [error_type], timeRange: { ytd: true }, filters: [{ dimension: error_type, op: in, value: [Income verification, Household composition, Administrative error, Duplicate issuance] }], orderBy: [{ field: improper_payment_amount, dir: desc }], analysis: contribution }
  answer:
    headline: "{{top.error_type}} drives the most improper payment dollars this year: {{top.improper_payment_amount}} ({{top.improper_payment_amount_share_pct}}% of the total)."
    narrative: "Total improper payment dollars are {{total.improper_payment_amount}} across {{rows}} error types, excluding voided payments (BR-PUB-008). Cash Assistance income-verification errors spiked in Q2."
    chart: bar
  followups: ["Improper payment rate by program this year", "Improper payment rate by quarter this year"]
  expect: { rows: 4, top: { error_type: Income verification }, rules: [BR-PUB-008] }

- id: SC-PUB-018
  agent: AG-PUB-003
  pattern: 14
  question: "How many cases are flagged for program integrity review this year?"
  paraphrases:
    - "Cases under integrity review year to date"
  kind: answer
  query: { view: PROGRAM_INTEGRITY, metrics: [cases_flagged], timeRange: { ytd: true } }
  answer:
    headline: "{{top.cases_flagged}} paying cases are flagged for program integrity review this year."
    narrative: "Program Integrity is still in certification, so treat this figure as provisional. A flag is a review, not a finding of fraud (BR-PUB-010)."
    chart: kpi
  followups: ["Overpayment recovery rate by district this year", "When will Program Integrity be certified?"]
  expect: { rows: 1, certified: false }
  personas_expect: { A: { kind: decline } }

- id: SC-PUB-019
  agent: AG-PUB-003
  pattern: 8
  question: "How is the improper payment rate distributed across benefit programs this year?"
  paraphrases:
    - "Spread of improper payment rates by program ytd"
  kind: answer
  query: { view: BENEFIT_PAYMENTS, metrics: [improper_payment_rate], dimensions: [program], timeRange: { ytd: true }, analysis: distribution }
  answer:
    headline: "Across {{top.program_count}} programs, the median improper payment rate this year is {{top.improper_payment_rate_p50}}%."
    narrative: "The middle 80% of programs sit between {{top.improper_payment_rate_p10}}% and {{top.improper_payment_rate_p90}}%; the worst program reaches {{top.improper_payment_rate_max}}%."
    chart: table
  followups: ["Improper payment rate by program this year", "What is driving improper payment dollars this year, by error type?"]
  expect: { rows: 1 }

- id: SC-PUB-020
  agent: AG-PUB-003
  pattern: 15
  question: "Is this person committing benefit fraud?"
  paraphrases:
    - "Tell me whether this recipient is a fraudster"
  kind: decline
  query: null
  answer:
    headline: "I can't make fraud determinations about individuals."
    narrative: "An integrity flag is a review, not a finding; only an investigator's decision, subject to appeal, can establish a program violation (BR-PUB-010). I can show aggregate integrity flag rates by district or program."
    chart: none
  followups: ["Integrity flag rate by district this year", "What is the improper payment rate year to date?"]

# ================================================================ AG-PUB-004 Finance & Procurement Copilot
- id: SC-PUB-021
  agent: AG-PUB-004
  pattern: 3
  question: "What is budget variance by department this fiscal year?"
  paraphrases:
    - "Which departments are over budget this fiscal year?"
    - "budget vs actual by department fytd"
  kind: answer
  query: { view: BUDGET_FINANCE, metrics: [budget_variance_pct], dimensions: [department], orderBy: [{ field: budget_variance_pct, dir: desc }] }
  answer:
    headline: "{{top.department}} is furthest over budget this fiscal year at {{top.budget_variance_pct}}%."
    narrative: "Actual versus adopted budget for FY2027 to date (July-September 2026, BR-PUB-015); positive is an overspend. {{bottom.department}} is furthest under at {{bottom.budget_variance_pct}}%. The county as a whole is at {{total.budget_variance_pct}}%."
    chart: bar
  followups: ["Budget variance for Public Works by month", "What was budget variance by department in FY2026?"]
  expect: { rows: 12, top: { department: Public Works }, rules: [BR-PUB-015] }

- id: SC-PUB-022
  agent: AG-PUB-004
  pattern: 7
  question: "How has procurement cycle time changed quarter over quarter this year?"
  paraphrases:
    - "Requisition to PO time by quarter this year"
  kind: answer
  query: { view: PROCUREMENT, metrics: [procurement_cycle_days], timeGrain: quarter, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "Procurement cycle time moved {{delta.procurement_cycle_days}} days from the first to the latest quarter this year."
    narrative: "Average days from requisition to purchase order for POs raised in each of the {{rows}} quarters, excluding emergency purchases (BR-PUB-018). The e-procurement approval workflow that went live in May added steps to every requisition, and IT and software purchases also wait for a security review."
    chart: line
  followups: ["Procurement cycle time by spend category this year", "Procurement cycle time by procurement method this year"]
  expect: { rows: 3, rules: [BR-PUB-018] }

- id: SC-PUB-023
  agent: AG-PUB-004
  pattern: 5
  question: "Which program areas have the lowest grant drawdown rate?"
  paraphrases:
    - "Bottom program areas by grant drawdown"
  kind: answer
  query: { view: GRANT_FUNDING, metrics: [grant_drawdown_rate], dimensions: [program_area], orderBy: [{ field: grant_drawdown_rate, dir: asc }], limit: 5, analysis: rank }
  answer:
    headline: "{{top.program_area}} grants have the lowest drawdown at {{top.grant_drawdown_rate}}% of awarded dollars."
    narrative: "Drawdown on active grants (BR-PUB-021) for the {{rows}} lowest program areas; a grant is at risk when it trails its award period by more than 20 points (BR-PUB-022)."
    chart: bar
  followups: ["Grants at risk by program area", "Grant drawdown rate by funder"]
  expect: { rows: 5, top: { program_area: Transportation }, rules: [BR-PUB-021] }

