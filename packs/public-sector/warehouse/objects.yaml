# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.SERVICE_OFFICE, kind: DYNAMIC TABLE, description: "Human services offices with filled caseworker positions", target_lag: 1 day, upstream: [RAW_BRONZE.CM_OFFICE], grain: one row per office }
  - { fqn: CURATED_SILVER.CONSTITUENT, kind: DYNAMIC TABLE, description: "Constituent master, deduplicated and conformed", target_lag: 15 minutes, upstream: [RAW_BRONZE.CM_PERSON], grain: one row per constituent }
  - { fqn: CURATED_SILVER.CASE_RECORD, kind: DYNAMIC TABLE, description: "Program cases with decoded pending action", target_lag: 15 minutes, upstream: [RAW_BRONZE.CM_CASE], grain: one row per case }
  - { fqn: CURATED_SILVER.BENEFIT_APPLICATION, kind: DYNAMIC TABLE, description: "Benefit applications with completeness, document holds and decisions", target_lag: 15 minutes, upstream: [RAW_BRONZE.ELIG_APPLICATION], grain: one row per application }
  - { fqn: CURATED_SILVER.BENEFIT_PAYMENT, kind: DYNAMIC TABLE, description: "Benefit payments with improper, overpayment and recovered amounts", target_lag: 1 hour, upstream: [RAW_BRONZE.BEN_PAYMENT], grain: one row per payment }
  - { fqn: CURATED_SILVER.SERVICE_REQUEST, kind: DYNAMIC TABLE, description: "311 requests with department routing, SLA and status", target_lag: 5 minutes, upstream: [RAW_BRONZE.SR311_REQUEST], grain: one row per request }
  - { fqn: CURATED_SILVER.PERMIT_APPLICATION, kind: DYNAMIC TABLE, description: "Permit applications with review track and decision date", target_lag: 1 hour, upstream: [RAW_BRONZE.PRM_APPLICATION], grain: one row per permit }
  - { fqn: CURATED_SILVER.PERMIT_INSPECTION, kind: DYNAMIC TABLE, description: "Field inspections against permits", target_lag: 1 hour, upstream: [RAW_BRONZE.PRM_INSPECTION], grain: one row per inspection }
  - { fqn: CURATED_SILVER.ROAD_SEGMENT, kind: DYNAMIC TABLE, description: "Road segments with pavement condition index", target_lag: 1 day, upstream: [RAW_BRONZE.PW_ROAD_SEGMENT], grain: one row per segment }
  - { fqn: CURATED_SILVER.STREET_WORK_ORDER, kind: DYNAMIC TABLE, description: "Street maintenance work orders with completion", target_lag: 1 hour, upstream: [RAW_BRONZE.PW_WORK_ORDER], grain: one row per work order }
  - { fqn: CURATED_SILVER.GL_BUDGET_LINE, kind: DYNAMIC TABLE, description: "Budget, actuals and positions by department and month", target_lag: 1 day, upstream: [RAW_BRONZE.FIN_GL_LINE], grain: one row per department per month }
  - { fqn: CURATED_SILVER.VENDOR_MASTER, kind: DYNAMIC TABLE, description: "Vendor master", target_lag: 1 day, upstream: [RAW_BRONZE.FIN_VENDOR], grain: one row per vendor }
  - { fqn: CURATED_SILVER.PURCHASE_ORDER_LINE, kind: DYNAMIC TABLE, description: "Requisition lines with PO date and cycle time", target_lag: 1 hour, upstream: [RAW_BRONZE.FIN_PO_LINE], grain: one row per requisition line }
  - { fqn: CURATED_SILVER.GRANT_AWARD, kind: DYNAMIC TABLE, description: "Grant awards with award period", target_lag: 1 day, upstream: [RAW_BRONZE.GRT_AWARD], grain: one row per grant }
  - { fqn: CURATED_SILVER.STAFF_POSITION, kind: DYNAMIC TABLE, description: "Authorised positions, filled or vacant", target_lag: 1 day, upstream: [RAW_BRONZE.HR_POSITION], grain: one row per position }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2019-2026 with county fiscal year (July-June) and business days", upstream: [CURATED_SILVER.BENEFIT_APPLICATION], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_OFFICE, kind: TABLE, description: "Office dimension with caseworker denominators by office, district and county", target_lag: 1 day, upstream: [CURATED_SILVER.SERVICE_OFFICE], grain: one row per office }
  - { fqn: CONFORMED_GOLD.DIM_CONSTITUENT, kind: TABLE, description: "Conformed constituent dimension", target_lag: 15 minutes, upstream: [CURATED_SILVER.CONSTITUENT], grain: one row per constituent }
  - { fqn: CONFORMED_GOLD.DIM_VENDOR, kind: TABLE, description: "Vendor dimension", target_lag: 1 day, upstream: [CURATED_SILVER.VENDOR_MASTER], grain: one row per vendor }
  - { fqn: CONFORMED_GOLD.FCT_CASE, kind: DYNAMIC TABLE, description: "Program case fact with backlog flag and backlog age", target_lag: 15 minutes, upstream: [CURATED_SILVER.CASE_RECORD, CONFORMED_GOLD.DIM_OFFICE, CONFORMED_GOLD.DIM_CONSTITUENT], grain: one row per case }
  - { fqn: CONFORMED_GOLD.FCT_APPLICATION, kind: DYNAMIC TABLE, description: "Benefit application fact with processing business days and the 30-day standard", target_lag: 15 minutes, upstream: [CURATED_SILVER.BENEFIT_APPLICATION, CONFORMED_GOLD.DIM_OFFICE, CONFORMED_GOLD.DIM_CONSTITUENT, CONFORMED_GOLD.DIM_DATE], grain: one row per application }
  - { fqn: CONFORMED_GOLD.FCT_PAYMENT, kind: DYNAMIC TABLE, description: "Benefit payment fact with quality-control and integrity outcomes", target_lag: 1 hour, upstream: [CURATED_SILVER.BENEFIT_PAYMENT, CONFORMED_GOLD.FCT_CASE, CONFORMED_GOLD.DIM_CONSTITUENT], grain: one row per payment }
  - { fqn: CONFORMED_GOLD.FCT_SERVICE_REQUEST, kind: DYNAMIC TABLE, description: "311 service request fact with SLA outcome", target_lag: 5 minutes, upstream: [CURATED_SILVER.SERVICE_REQUEST], grain: one row per request }
  - { fqn: CONFORMED_GOLD.FCT_PERMIT, kind: DYNAMIC TABLE, description: "Permit fact with review turnaround, target and inspection outcomes", target_lag: 1 hour, upstream: [CURATED_SILVER.PERMIT_APPLICATION, CURATED_SILVER.PERMIT_INSPECTION], grain: one row per permit }
  - { fqn: CONFORMED_GOLD.FCT_WORK_ORDER, kind: DYNAMIC TABLE, description: "Street maintenance work order fact with repair target and road condition", target_lag: 1 hour, upstream: [CURATED_SILVER.STREET_WORK_ORDER, CURATED_SILVER.ROAD_SEGMENT], grain: one row per work order }
  - { fqn: CONFORMED_GOLD.FCT_BUDGET, kind: DYNAMIC TABLE, description: "Budget, actual expenditure and positions by department and fiscal month", target_lag: 1 day, upstream: [CURATED_SILVER.GL_BUDGET_LINE], grain: one row per department per month }
  - { fqn: CONFORMED_GOLD.FCT_PO_SPEND, kind: DYNAMIC TABLE, description: "Purchasing fact with cycle time, method and contract coverage", target_lag: 1 hour, upstream: [CURATED_SILVER.PURCHASE_ORDER_LINE, CONFORMED_GOLD.DIM_VENDOR], grain: one row per requisition line }
  - { fqn: CONFORMED_GOLD.FCT_GRANT, kind: DYNAMIC TABLE, description: "Grant award fact with drawdown against the elapsed award period", target_lag: 1 day, upstream: [CURATED_SILVER.GRANT_AWARD], grain: one row per grant }
  - { fqn: CONFORMED_GOLD.FCT_POSITION, kind: DYNAMIC TABLE, description: "Position fact with vacancy age and agency cover", target_lag: 1 day, upstream: [CURATED_SILVER.STAFF_POSITION], grain: one row per position }
