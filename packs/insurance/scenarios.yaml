    - "open claim count"
    - "how many claims are still open"
  kind: answer
  query: { view: CLAIMS_OPERATIONS, metrics: [open_claims], analysis: value }
  answer:
    headline: "There are {{top.open_claims}} open claims in the governed claim sample."
    narrative: "Claims with status Open or Reopened and a case reserve above zero (BR-INS-009)."
    chart: kpi
  followups: ["Open claims by line of business", "Claims cycle time by adjuster team this year"]
  expect: { rows: 1 }

- id: SC-INS-010
  agent: AG-INS-001
  pattern: 12
  question: "Which five claimants have the highest average claim severity this year?"
  paraphrases:
    - "Top 5 claimants by claim severity this year"
