    narrative: "{{bottom.handling_team}} is lowest at {{bottom.avg_severity}} and {{bottom.avg_cycle_days}} days, across {{rows}} adjuster teams; catastrophe claims are excluded (BR-INS-004)."
    chart: bar
  followups: ["Claims cycle time by line of business this year", "Open claims by line of business"]
  expect: { rows: 5, top: { handling_team: Complex & large loss }, rules: [BR-INS-004] }

- id: SC-INS-014
  agent: AG-INS-001
  pattern: 13
  question: "How many claims did each region report last quarter?"
  paraphrases:
    - "claims reported by region last quarter"
    - "claim volume per region last qtr"
  kind: answer
  query: { view: CLAIMS_OPERATIONS, metrics: [claims_reported], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: claims_reported, dir: desc }] }
  answer:
