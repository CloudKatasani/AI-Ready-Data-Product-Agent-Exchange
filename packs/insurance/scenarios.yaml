  kind: answer
  query: { view: CLAIMS_OPERATIONS, metrics: [avg_severity], dimensions: [claimant_name], timeRange: { ytd: true }, orderBy: [{ field: avg_severity, dir: desc }], limit: 5, analysis: rank }
  answer:
    headline: "The largest claimant severity this year is {{top.avg_severity}}."
    narrative: "Claimant names are masked unless your persona is cleared for PII under the masking policy. Showing the top {{rows}} claimants by average incurred loss, catastrophe claims excluded (BR-INS-004)."
    chart: table
  followups: ["Average claim severity by line of business this year", "Open claims by line of business"]
  expect: { rows: 5, rules: [BR-INS-004] }
  personas_expect: { A: { masked: [claimant_name], rowFiltered: true }, D: { masked: [] } }

- id: SC-INS-011
  agent: AG-INS-001
  pattern: 6
  question: "What is driving paid losses by cause of loss this year?"
  paraphrases:
    - "Which causes of loss contribute most to paid losses this year?"
    - "paid losses breakdown by loss cause ytd"
  kind: answer
  query: { view: CLAIMS_OPERATIONS, metrics: [paid_losses], dimensions: [cause_of_loss], timeRange: { ytd: true }, orderBy: [{ field: paid_losses, dir: desc }], analysis: contribution }
  answer:
    headline: "{{top.cause_of_loss}} drove the most paid losses this year at {{top.paid_losses}}."
    narrative: "Total paid losses were {{total.paid_losses}} across {{rows}} causes of loss on claims with a loss date this year; LAE is excluded."
    chart: bar
  followups: ["Average claim severity by line of business this year", "Subrogation recovery rate this year"]
  expect: { rows: 19 }

- id: SC-INS-012
  agent: AG-INS-001
  pattern: 14
  question: "What is our total case reserve balance?"
  paraphrases:
    - "case reserve balance at the latest valuation"
    - "how much do we hold in case reserves"
  kind: answer
  query: { view: LOSS_RESERVES, metrics: [case_reserve_balance], timeRange: { last: { n: 1, unit: month } } }
  answer:
    headline: "The case reserve balance at the latest month-end valuation is {{top.case_reserve_balance}}."
    narrative: "Loss Reserves is still in certification, so treat this figure as provisional. Balances come from month-end valuations and are averaged, never summed (BR-INS-015)."
    chart: kpi
  followups: ["IBNR reserve by line of business", "When will Loss Reserves be certified?"]
  expect: { rows: 1, certified: false }
  personas_expect: { A: { kind: decline } }

- id: SC-INS-013
  agent: AG-INS-001
  pattern: 9
  question: "How do claim severity and cycle time compare across adjuster teams this year?"
  paraphrases:
    - "Compare claim severity and claims cycle time by adjuster team"
    - "adjuster team comparison of severity and cycle time ytd"
  kind: answer
  query: { view: CLAIMS_OPERATIONS, metrics: [avg_severity, avg_cycle_days], dimensions: [handling_team], timeRange: { ytd: true }, orderBy: [{ field: avg_severity, dir: desc }] }
  answer:
