# Scripted scenarios for Sentinel Mutual — ported from AI-Ready insurance `scenarios.ts` (S-01..S-15) and the
# Marketplace AG-INS-001..004 demo exchanges. Numbers come from golden.json; `expect` holds shape assertions only.
# Together the 28 scenarios cover all 15 patterns (04 §6).

# ================================================================ AG-INS-002 Underwriting Copilot
- id: SC-INS-001
  agent: AG-INS-002
  pattern: 3
  question: "What was the loss ratio by region last quarter?"
  paraphrases:
    - "What was the loss ratio by region last quarter, excluding catastrophe losses?"
    - "loss ratio per region last qtr"
    - "ex-cat loss ratio by territory last quarter"
  kind: answer
  query: { view: UNDERWRITING_RESULT, metrics: [loss_ratio], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: loss_ratio, dir: desc }] }
  answer:
    headline: "{{top.region}} had the highest loss ratio last quarter at {{top.loss_ratio}}%."
    narrative: "Catastrophe-coded losses are excluded (BR-INS-001) and losses are measured on earned premium. {{bottom.region}} was lowest at {{bottom.loss_ratio}}% across {{rows}} regions; the company-wide loss ratio was {{total.loss_ratio}}%."
    chart: bar
  followups: ["Which lines drove the West?", "Include catastrophe losses", "Loss ratio trend this year"]
  expect: { rows: 4, top: { region: West }, rules: [BR-INS-001] }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-INS-002
  agent: AG-INS-002
  pattern: 10
  question: "What was the loss ratio by region last quarter, including catastrophe losses?"
  paraphrases:
    - "loss ratio by region last quarter including cats"
    - "all-in loss ratio by region last quarter"
  kind: answer
  query: { view: UNDERWRITING_RESULT, metrics: [loss_ratio], dimensions: [region], timeRange: { last: { n: 1, unit: quarter } }, orderBy: [{ field: loss_ratio, dir: desc }] }
  answer:
    headline: "Including catastrophe losses, {{top.region}} had the highest loss ratio last quarter at {{top.loss_ratio}}%."
    narrative: "You asked for catastrophe losses, so the exclusion in BR-INS-001 is not applied. The August Atlantic hurricane pushes the South to the top — compare with the standard ex-cat view, where the West leads."
    chart: bar
  followups: ["Exclude catastrophe losses", "Catastrophe loss ratio by quarter"]
  expect: { rows: 4, top: { region: South } }
  personas_expect: { A: { rowFiltered: true } }

- id: SC-INS-003
  agent: AG-INS-002
  pattern: 4
  question: "How has the combined ratio trended month by month this year?"
  paraphrases:
    - "Monthly combined ratio year to date"
    - "combined ratio trend ytd by month"
  kind: answer
  query: { view: UNDERWRITING_RESULT, metrics: [combined_ratio], timeGrain: month, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "The combined ratio is {{total.combined_ratio}}% year to date, moving {{delta.combined_ratio}} points from January to the latest month."
    narrative: "All-in loss ratio plus LAE and expense ratios on earned premium over {{rows}} months (BR-INS-003). Watch August: the Atlantic hurricane lifts the all-in loss ratio."
    chart: line
  followups: ["Loss ratio by region last quarter", "Catastrophe loss ratio by quarter"]
  expect: { rows: 9 }

- id: SC-INS-004
  agent: AG-INS-002
  pattern: 7
  question: "How has earned premium changed quarter over quarter this year?"
  paraphrases:
    - "Earned premium by quarter year to date"
    - "is earned premium growing quarter on quarter?"
  kind: answer
  query: { view: UNDERWRITING_RESULT, metrics: [earned_premium], timeGrain: quarter, timeRange: { ytd: true }, analysis: trend }
  answer:
    headline: "Earned premium moved {{delta.earned_premium}} from the first to the latest quarter this year."
    narrative: "Premium earned in each of the {{rows}} quarters this year (governed policy-month sample), reflecting the 2026 rate increases earning through."
    chart: line
  followups: ["Written premium by distribution channel this year", "Combined ratio this year"]
  expect: { rows: 3 }

- id: SC-INS-005
  agent: AG-INS-002
  pattern: 2
  question: "Is the expense ratio within target this year?"
  paraphrases:
    - "Are we inside our expense ratio target year to date?"
    - "expense ratio vs target ytd"
  kind: answer
  query: { view: UNDERWRITING_RESULT, metrics: [expense_ratio], timeRange: { ytd: true }, analysis: compare_target }
  answer:
    headline: "The expense ratio is {{top.expense_ratio}}% year to date — {{vsTarget.top}} target."
    narrative: "Commission and underwriting expense on earned premium (BR-INS-008); the Q3 contingent-commission accrual on personal lines is included."
    chart: kpi
  followups: ["Expense ratio by quarter this year", "Combined ratio this year"]
  expect: { rows: 1 }

- id: SC-INS-006
  agent: AG-INS-002
  pattern: 5
  question: "Which five states had the highest incurred losses this year?"
  paraphrases:
    - "Top 5 states by incurred losses this year"
    - "worst states for incurred losses ytd"
  kind: answer
  query: { view: UNDERWRITING_RESULT, metrics: [incurred_losses], dimensions: [state], timeRange: { ytd: true }, orderBy: [{ field: incurred_losses, dir: desc }], limit: 5, analysis: rank }
  answer:
    headline: "{{top.state}} had the highest incurred losses this year at {{top.incurred_losses}}."
    narrative: "The {{rows}} states with the most incurred losses (paid plus case reserves, catastrophe losses included) on claims with a loss date this year (BR-INS-005)."
    chart: bar
  followups: ["Incurred losses by catastrophe peril this year", "Loss ratio by region last quarter"]
  expect: { rows: 5, top: { state: TX } }

- id: SC-INS-007
  agent: AG-INS-002
  pattern: 15
  question: "What is our quote-to-bind ratio?"
  paraphrases:
    - "How many of our quotes are binding?"
  kind: redirect
  query: null
  redirect_to: AG-INS-003
  answer:
    headline: "That's a distribution question — Distribution Insights answers it."
    narrative: "I cover loss, expense and combined ratios, premium and claim frequency. Distribution Insights is certified on the submission funnel, quote-to-bind and new business premium."
    chart: none
  followups: ["Ask Distribution Insights", "What can you answer?"]

- id: SC-INS-008
  agent: AG-INS-002
  pattern: 15
  question: "File our homeowners rate increase with the state."
  paraphrases:
    - "Can you submit the homeowners rate filing for us?"
    - "Change the auto rates in Texas"
  kind: decline
  query: null
  answer:
    headline: "I can't file or change rates — that is outside what this agent is allowed to do."
    narrative: "Rate filings and pricing changes are decided by the pricing actuary and filed by product and state. I can show you the loss ratio and combined ratio by line and region so the filing has the evidence."
    chart: none
  followups: ["Loss ratio by line of business this year", "Combined ratio this year"]

# ================================================================ AG-INS-001 Claims Analyst
- id: SC-INS-009
  agent: AG-INS-001
  pattern: 1
  question: "How many open claims do we have?"
