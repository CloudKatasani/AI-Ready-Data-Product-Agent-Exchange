# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.AGENCY, kind: DYNAMIC TABLE, description: "Conformed agency and broker master", target_lag: 1 day, upstream: [RAW_BRONZE.AMS_AGENCY], grain: one row per agency }
  - { fqn: CURATED_SILVER.LINE_OF_BUSINESS, kind: DYNAMIC TABLE, description: "Lines of business with statement line and plan ratios", target_lag: 1 day, upstream: [RAW_BRONZE.PAS_LINE_OF_BUSINESS], grain: one row per line of business }
  - { fqn: CURATED_SILVER.CAT_EVENT, kind: DYNAMIC TABLE, description: "Catastrophe code list with peril, footprint and dates", target_lag: 1 hour, upstream: [RAW_BRONZE.CAT_EVENT], grain: one row per catastrophe event }
  - { fqn: CURATED_SILVER.ADJUSTER, kind: DYNAMIC TABLE, description: "Claims adjusters with region and experience", target_lag: 1 day, upstream: [RAW_BRONZE.HR_ADJUSTER], grain: one row per adjuster }
  - { fqn: CURATED_SILVER.POLICYHOLDER, kind: DYNAMIC TABLE, description: "Policyholder party master, deduplicated and conformed", target_lag: 15 minutes, upstream: [RAW_BRONZE.PAS_POLICYHOLDER], grain: one row per policyholder }
  - { fqn: CURATED_SILVER.INSURANCE_POLICY, kind: DYNAMIC TABLE, description: "Policies with conformed line, status and renewal outcome", target_lag: 15 minutes, upstream: [RAW_BRONZE.PAS_POLICY], grain: one row per policy }
  - { fqn: CURATED_SILVER.PREMIUM_MONTH, kind: DYNAMIC TABLE, description: "Sampled policy-month written and earned premium with underwriting expense", target_lag: 1 day, upstream: [RAW_BRONZE.PAS_PREMIUM_MONTH], grain: one row per sampled policy-month record }
  - { fqn: CURATED_SILVER.CLAIM_HEADER, kind: DYNAMIC TABLE, description: "Claims with status, paid, case reserve, LAE, recoveries and catastrophe code", target_lag: 15 minutes, upstream: [RAW_BRONZE.CLM_CLAIM], grain: one row per claim }
  - { fqn: CURATED_SILVER.RESERVE_VALUATION, kind: DYNAMIC TABLE, description: "Month-end case, IBNR and indicated reserves per claim", target_lag: 1 day, upstream: [RAW_BRONZE.CLM_RESERVE_VALUATION], grain: one row per claim-month valuation }
  - { fqn: CURATED_SILVER.SUBMISSION, kind: DYNAMIC TABLE, description: "Submissions with quote, bind and turnaround", target_lag: 1 hour, upstream: [RAW_BRONZE.UW_SUBMISSION], grain: one row per submission }
  - { fqn: CURATED_SILVER.INVOICE, kind: DYNAMIC TABLE, description: "Premium invoices with payment method and days past due", target_lag: 1 hour, upstream: [RAW_BRONZE.BILL_INVOICE], grain: one row per invoice }
  - { fqn: CURATED_SILVER.PAYMENT, kind: DYNAMIC TABLE, description: "Premium payments (holds the card number; PCI)", target_lag: 1 hour, upstream: [RAW_BRONZE.BILL_PAYMENT], grain: one row per payment }
  - { fqn: CURATED_SILVER.SERVICE_CONTACT, kind: DYNAMIC TABLE, description: "Policyholder service contacts", target_lag: 15 minutes, upstream: [RAW_BRONZE.CRM_SERVICE_CONTACT], grain: one row per contact }
  - { fqn: CURATED_SILVER.NPS_SURVEY, kind: DYNAMIC TABLE, description: "Post-contact survey responses with NPS category", target_lag: 1 hour, upstream: [RAW_BRONZE.CX_NPS_SURVEY], grain: one row per survey response }
  - { fqn: CURATED_SILVER.UW_TRANSACTION, kind: DYNAMIC TABLE, description: "Earned premium records and claims conformed into one underwriting transaction shape", target_lag: 1 hour, upstream: [CURATED_SILVER.PREMIUM_MONTH, CURATED_SILVER.CLAIM_HEADER], grain: one row per premium record or claim }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2015-2026", upstream: [CURATED_SILVER.PREMIUM_MONTH], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_AGENCY, kind: TABLE, description: "Agency dimension with policies serviced", target_lag: 1 day, upstream: [CURATED_SILVER.AGENCY, CURATED_SILVER.INSURANCE_POLICY], grain: one row per agency }
  - { fqn: CONFORMED_GOLD.DIM_LINE, kind: TABLE, description: "Line of business dimension with statement line and plan ratios", target_lag: 1 day, upstream: [CURATED_SILVER.LINE_OF_BUSINESS], grain: one row per line of business }
  - { fqn: CONFORMED_GOLD.DIM_CAT_EVENT, kind: TABLE, description: "Catastrophe event dimension (key 0 = non-catastrophe)", target_lag: 1 hour, upstream: [CURATED_SILVER.CAT_EVENT], grain: one row per catastrophe event }
  - { fqn: CONFORMED_GOLD.DIM_POLICYHOLDER, kind: TABLE, description: "Conformed policyholder dimension with tenure and multi-line relationship", target_lag: 15 minutes, upstream: [CURATED_SILVER.POLICYHOLDER, CURATED_SILVER.INSURANCE_POLICY], grain: one row per policyholder }
  - { fqn: CONFORMED_GOLD.DIM_POLICY, kind: TABLE, description: "Policy dimension with in-force status, renewal outcome and tenure", target_lag: 15 minutes, upstream: [CURATED_SILVER.INSURANCE_POLICY, CONFORMED_GOLD.DIM_POLICYHOLDER, CONFORMED_GOLD.DIM_AGENCY, CONFORMED_GOLD.DIM_LINE], grain: one row per policy }
  - { fqn: CONFORMED_GOLD.FCT_UW_LEDGER, kind: DYNAMIC TABLE, description: "Underwriting ledger: earned premium, expense, incurred losses and LAE on one denominator", target_lag: 1 hour, upstream: [CURATED_SILVER.UW_TRANSACTION, CONFORMED_GOLD.DIM_POLICY, CONFORMED_GOLD.DIM_CAT_EVENT], grain: one row per premium record or claim }
  - { fqn: CONFORMED_GOLD.FCT_CLAIM, kind: DYNAMIC TABLE, description: "Claim fact with cycle time, payments, reserves, recoveries and SIU referral", target_lag: 15 minutes, upstream: [CURATED_SILVER.CLAIM_HEADER, CURATED_SILVER.ADJUSTER, CONFORMED_GOLD.DIM_POLICY, CONFORMED_GOLD.DIM_CAT_EVENT], grain: one row per claim }
  - { fqn: CONFORMED_GOLD.FCT_RESERVE, kind: DYNAMIC TABLE, description: "Month-end reserve valuation fact (case, IBNR, carried and indicated)", target_lag: 1 day, upstream: [CURATED_SILVER.RESERVE_VALUATION, CONFORMED_GOLD.DIM_POLICY], grain: one row per claim-month valuation }
  - { fqn: CONFORMED_GOLD.FCT_SUBMISSION, kind: DYNAMIC TABLE, description: "Submission funnel fact: quoted, bound, premium and turnaround", target_lag: 1 hour, upstream: [CURATED_SILVER.SUBMISSION, CONFORMED_GOLD.DIM_AGENCY], grain: one row per submission }
  - { fqn: CONFORMED_GOLD.FCT_INVOICE, kind: DYNAMIC TABLE, description: "Premium invoice fact with payments and delinquency bucket", target_lag: 1 hour, upstream: [CURATED_SILVER.INVOICE, CURATED_SILVER.PAYMENT, CONFORMED_GOLD.DIM_POLICY], grain: one row per invoice }
  - { fqn: CONFORMED_GOLD.FCT_SERVICE_CONTACT, kind: DYNAMIC TABLE, description: "Service contact fact with complaint flag, first-contact resolution and survey score", target_lag: 15 minutes, upstream: [CURATED_SILVER.SERVICE_CONTACT, CURATED_SILVER.NPS_SURVEY, CONFORMED_GOLD.DIM_POLICYHOLDER], grain: one row per service contact }
