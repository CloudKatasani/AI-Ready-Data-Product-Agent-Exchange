# "Break something" templates (05 §2.4). Ported from AI-Ready ext/operate.ts INC-1..INC-5 and retargeted to the
# Sentinel Mutual Gold objects. Effects are applied as overlay views in the _INCIDENT schema while an incident is open.
- id: INC-INS-LATE-FEED
  kind: late_feed
  title: First-notice-of-loss feed six hours late
  severity: SEV2
  object: CONFORMED_GOLD.FCT_CLAIM
  column: fnol_ts
  params: { lag_hours: 6 }
  affects: { products: [DP-INS-002], agents: [AG-INS-001] }
  narrative: >-
    The claims platform's FNOL extract stalled and no new claims have landed for six hours. Claims Experience is now
    behind its 60-minute freshness SLA, so today's claim counts and open inventory understate activity and any agent
    answer about recent claims is stale.
  detection: Freshness rule DQ-INS-031 on FCT_CLAIM.fnol_ts fails and the product moves to Degraded.
  resolution: Restart the FNOL extract, backfill the six-hour gap and re-run the DQ rules; the product returns to Healthy.
- id: INC-INS-NULL-SPIKE
  kind: null_spike
  title: Null spike in earned premium
  severity: SEV1
  object: CONFORMED_GOLD.FCT_UW_LEDGER
  column: earned_premium
  params: { null_pct: 15 }
  affects: { products: [DP-INS-003], agents: [AG-INS-002] }
  narrative: >-
    A policy administration release left 15% of ledger rows without earned premium, so every loss, expense and combined
    ratio is computed over a partial denominator and overstated. Earned premium is a critical data element feeding
    statutory reporting.
  detection: Completeness rule DQ-INS-016 on earned_premium fails; Underwriting Result is Degraded.
  resolution: Revert the premium extract mapping, reload the affected months and confirm the null rate is back to zero.
- id: INC-INS-DUP-LOAD
  kind: duplicate_load
  title: Duplicate invoice load from the billing platform
  severity: SEV3
  object: CONFORMED_GOLD.FCT_INVOICE
  params: { duplicate_pct: 10 }
  affects: { products: [DP-INS-005], agents: [AG-INS-004] }
  narrative: >-
    A replayed billing batch loaded 10% of invoices twice. Premium billed is inflated and the delinquency and autopay
    rates are skewed while the duplicates remain.
  detection: Uniqueness rule DQ-INS-049 on invoice_id fails and the row count jumps against the trailing average.
  resolution: Delete the replayed batch by load id, re-run deduplication and confirm dup_rate returns to zero.
- id: INC-INS-SCHEMA-DRIFT
  kind: schema_drift
  title: Case reserve column renamed upstream
  severity: SEV1
  object: CONFORMED_GOLD.FCT_RESERVE
  column: case_reserve
  params: { rename_to: case_os_amt }
  affects: { products: [DP-INS-006], agents: [AG-INS-001] }
  narrative: >-
    A claims platform release renamed case_reserve to case_os_amt in the reserving extract without a contract change.
    Every reserve metric that depends on it fails to compile, so the Claims Analyst declines reserve questions with an
    incident banner instead of answering.
  detection: Metric compilation for LOSS_RESERVES fails and DQ-INS-034 cannot find its column; the contract check flags a breaking change.
  resolution: Map case_os_amt back to case_reserve in Silver, raise a contract major version with a 30-day notice, and re-run checks.
- id: INC-INS-VOLUME
  kind: volume_anomaly
  title: Missing days of service contacts
  severity: SEV2
  object: CONFORMED_GOLD.FCT_SERVICE_CONTACT
  params: { missing_days: 2 }
  affects: { products: [DP-INS-007], agents: [] }
  narrative: >-
    Two days of service contacts never arrived from the CRM event stream, so the most recent contacts and surveys are
    missing. Complaint rate and NPS show a false shift at the end of the series.
  detection: Timeliness rule DQ-INS-056 on contact_ts fails and daily contact volume drops against the trailing average.
  resolution: Replay the CRM event stream for the missing days and confirm daily volumes match the trailing average.
