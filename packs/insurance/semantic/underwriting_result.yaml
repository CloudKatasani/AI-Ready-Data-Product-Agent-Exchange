name: UNDERWRITING_RESULT
description: Underwriting ledger — earned and written premium, incurred losses, LAE and expense; loss, catastrophe, expense and combined ratios by line, region and accident period
tables:
  - { alias: l, fqn: CONFORMED_GOLD.FCT_UW_LEDGER, pk: ledger_key }
  - { alias: p, fqn: CONFORMED_GOLD.DIM_POLICY, pk: policy_key }
  - { alias: ln, fqn: CONFORMED_GOLD.DIM_LINE, pk: line_key }
  - { alias: c, fqn: CONFORMED_GOLD.DIM_CAT_EVENT, pk: cat_event_key }
  - { alias: d, fqn: CONFORMED_GOLD.DIM_DATE, pk: date_key }
relationships:
  - { from: l.policy_key, to: p.policy_key }
  - { from: l.line_key, to: ln.line_key }
  - { from: l.cat_event_key, to: c.cat_event_key }
  - { from: l.date_key, to: d.date_key }
dimensions:
  - { name: region, expr: p.region, label: Region, synonyms: [territory, operating region], term: GT-INS-REGION }
  - { name: state, expr: p.state, label: State, synonyms: [states, risk state] }
  - { name: line_of_business, expr: p.line_of_business, label: Line of business, synonyms: [lob, product line, lines of business], term: GT-INS-LOB }
  - { name: segment, expr: p.segment, label: Segment, synonyms: [personal or commercial, personal vs commercial] }
  - { name: channel, expr: p.channel, label: Distribution channel, synonyms: [sales channel, distribution channels], term: GT-INS-CHANNEL }
  - { name: statement_line, expr: ln.statement_line, label: Statement line, synonyms: [annual statement line, statutory line] }
  - { name: catastrophe_loss, expr: l.is_catastrophe, label: Catastrophe loss, synonyms: [cat coded, catastrophe coded], term: GT-INS-CAT-EVENT }
  - { name: cat_peril, expr: c.peril, label: Catastrophe peril, synonyms: [peril, cat peril] }
  - { name: cat_event, expr: c.event_name, label: Catastrophe event, synonyms: [cat event, named event] }
time_dimensions:
  - { name: accident_date, expr: d.date, default: true }
facts:
  - { name: earned_premium_amount, expr: l.earned_premium }
  - { name: incurred_loss_amount, expr: l.incurred_loss }
metrics:
  - name: loss_ratio
    label: Loss ratio
    expr: 100.0 * SUM(l.incurred_loss) / NULLIF(SUM(l.earned_premium), 0)
    unit: '%'
    decimals: 1
    direction: lower_is_better
    synonyms: [ex-cat loss ratio, attritional loss ratio, loss ratio ex cat, lr]
    term: GT-INS-LOSS-RATIO
    description: Incurred losses as a share of earned premium, accident period; catastrophe-coded losses excluded by default (BR-INS-001)
    default_filters: [ { rule: BR-INS-001 } ]
    naive_expr: 100.0 * (SUM(l.incurred_loss) + SUM(l.lae_amount)) / NULLIF(SUM(l.written_premium), 0)
  - name: cat_loss_ratio
    label: Catastrophe loss ratio
    expr: 100.0 * SUM(CASE WHEN l.is_catastrophe THEN l.incurred_loss ELSE 0 END) / NULLIF(SUM(l.earned_premium), 0)
    unit: pts
    decimals: 1
    direction: lower_is_better
    synonyms: [cat points, cat load, catastrophe points, cat loss ratio]
    term: GT-INS-CAT-LOSS
    description: Catastrophe-coded incurred losses as points of earned premium
  - name: lae_ratio
    label: LAE ratio
    expr: 100.0 * SUM(l.lae_amount) / NULLIF(SUM(l.earned_premium), 0)
    unit: '%'
    decimals: 1
    direction: lower_is_better
    synonyms: [loss adjustment expense ratio, lae, claims handling cost ratio]
    term: GT-INS-LAE
    description: Loss adjustment expense as a share of earned premium
  - name: expense_ratio
    label: Expense ratio
    expr: 100.0 * SUM(l.uw_expense) / NULLIF(SUM(l.earned_premium), 0)
    unit: '%'
    decimals: 1
    direction: lower_is_better
    synonyms: [underwriting expense ratio, acquisition cost ratio, commission and expense ratio]
    term: GT-INS-EXPENSE-RATIO
    description: Commission and underwriting expense as a share of earned premium
  - name: combined_ratio
    label: Combined ratio
    expr: 100.0 * (SUM(l.incurred_loss) + SUM(l.lae_amount) + SUM(l.uw_expense)) / NULLIF(SUM(l.earned_premium), 0)
    unit: '%'
    decimals: 1
    direction: lower_is_better
    synonyms: [cor, combined operating ratio, underwriting result ratio]
    term: GT-INS-COMBINED-RATIO
    description: All-in loss ratio plus LAE ratio plus expense ratio, on earned premium
    naive_expr: 100.0 * (SUM(l.paid_loss) + SUM(l.uw_expense)) / NULLIF(SUM(l.written_premium), 0)
  - name: earned_premium
    label: Earned premium
    expr: SUM(l.earned_premium)
    unit: USD
    decimals: 0
    direction: higher_is_better
    synonyms: [ep, premium earned, net earned premium]
    term: GT-INS-EARNED-PREMIUM
    description: Premium earned in the period (governed policy-month sample)
    naive_expr: SUM(l.written_premium)
  - name: written_premium
    label: Written premium
    expr: SUM(l.written_premium)
    unit: USD
    decimals: 0
    direction: higher_is_better
    synonyms: [gwp, gross written premium, premium written]
    term: GT-INS-WRITTEN-PREMIUM
    description: Premium written in the period (governed policy-month sample)
  - name: incurred_losses
    label: Incurred losses
    expr: SUM(l.incurred_loss)
    unit: USD
    decimals: 0
    direction: lower_is_better
    synonyms: [losses incurred, incurred loss, incurred loss dollars]
    term: GT-INS-INCURRED-LOSS
    description: Paid plus case reserves on claims with a loss date in the period, catastrophe losses included
  - name: claim_frequency
    label: Claim frequency
    expr: 100.0 * 12 * SUM(l.claim_count) / NULLIF(SUM(l.exposure_months), 0)
    unit: per hundred policy-years
    decimals: 2
    direction: lower_is_better
    synonyms: [frequency, claims per 100 policies, claim rate per exposure]
    term: GT-INS-CLAIM-FREQUENCY
    description: Claims per 100 policy-years of earned exposure
products: [DP-INS-003]
