    agents: [AG-HC-001, AG-HC-002, AG-HC-004]
  - persona: healthcare:quality-analyst
    products: [DP-HC-002, DP-HC-003, DP-HC-004, DP-HC-007]
    agents: [AG-HC-002, AG-HC-004]
  - persona: healthcare:clinical-dpo
    products: [DP-HC-002, DP-HC-003, DP-HC-004, DP-HC-006, DP-HC-007]
    agents: [AG-HC-002, AG-HC-003, AG-HC-004]
  - persona: healthcare:his-steward
    products: [DP-HC-001, DP-HC-002, DP-HC-003, DP-HC-004, DP-HC-005, DP-HC-006, DP-HC-007, DP-HC-008]
    agents: [AG-HC-001, AG-HC-002, AG-HC-003, AG-HC-004, AG-HC-005]
  - persona: healthcare:coo
