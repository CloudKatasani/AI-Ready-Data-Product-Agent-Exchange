- term: Market
  synonyms: [region, service area, geography]
  maps_to: { kind: dimension, ref: region }
- term: Metro
  synonyms: [metro market, the city hospitals]
  maps_to: { kind: value, ref: region=Metro }
- term: Riverside
  synonyms: [riverside market]
  maps_to: { kind: value, ref: region=Riverside }

