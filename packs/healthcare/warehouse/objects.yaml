# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.FACILITY, kind: DYNAMIC TABLE, description: "Conformed hospital campuses", target_lag: 1 day, upstream: [RAW_BRONZE.FAC_FACILITY], grain: one row per facility }
  - { fqn: CURATED_SILVER.CARE_UNIT, kind: DYNAMIC TABLE, description: "Staffed inpatient care units", target_lag: 1 day, upstream: [RAW_BRONZE.ADT_UNIT], grain: one row per care unit }
  - { fqn: CURATED_SILVER.PATIENT, kind: DYNAMIC TABLE, description: "Patient master, deduplicated and conformed (PHI)", target_lag: 15 minutes, upstream: [RAW_BRONZE.EMPI_PATIENT], grain: one row per medical record number }
  - { fqn: CURATED_SILVER.CLINICIAN, kind: DYNAMIC TABLE, description: "Credentialed physicians and advanced practice providers", target_lag: 1 day, upstream: [RAW_BRONZE.HR_PROVIDER], grain: one row per provider }
  - { fqn: CURATED_SILVER.ENCOUNTER, kind: DYNAMIC TABLE, description: "Deduplicated inpatient encounters with discharge date and readmission outcome", target_lag: 15 minutes, upstream: [RAW_BRONZE.ADT_ENCOUNTER], grain: one row per inpatient encounter }
  - { fqn: CURATED_SILVER.ED_VISIT, kind: DYNAMIC TABLE, description: "ED visits with LWBS and boarding rules applied", target_lag: 5 minutes, upstream: [RAW_BRONZE.ED_TRACKING_VISIT], grain: one row per ED visit }
  - { fqn: CURATED_SILVER.PAYER, kind: DYNAMIC TABLE, description: "Payer master", target_lag: 1 day, upstream: [RAW_BRONZE.PM_PAYER], grain: one row per payer }
  - { fqn: CURATED_SILVER.CLAIM_HEADER, kind: DYNAMIC TABLE, description: "Submitted claims with scrubber and initial denial outcome", target_lag: 1 hour, upstream: [RAW_BRONZE.PB_CLAIM], grain: one row per claim }
  - { fqn: CURATED_SILVER.REMITTANCE, kind: DYNAMIC TABLE, description: "Payer remittances applied to claims", target_lag: 1 hour, upstream: [RAW_BRONZE.PB_REMITTANCE], grain: one row per remittance }
  - { fqn: CURATED_SILVER.APPOINTMENT, kind: DYNAMIC TABLE, description: "Medical group appointments and outcomes", target_lag: 15 minutes, upstream: [RAW_BRONZE.SCH_APPOINTMENT], grain: one row per appointment }
  - { fqn: CURATED_SILVER.STAFFING_DAY, kind: DYNAMIC TABLE, description: "One staffing record per care unit per day", target_lag: 1 hour, upstream: [RAW_BRONZE.WFM_STAFFING_DAY], grain: one row per care unit per day }
  - { fqn: CURATED_SILVER.SURVEY_RESPONSE, kind: DYNAMIC TABLE, description: "Patient experience survey returns", target_lag: 1 day, upstream: [RAW_BRONZE.PG_SURVEY], grain: one row per survey }
  - { fqn: CURATED_SILVER.SAFETY_EVENT, kind: DYNAMIC TABLE, description: "Patient safety events", target_lag: 1 hour, upstream: [RAW_BRONZE.QM_SAFETY_EVENT], grain: one row per safety event }
  - { fqn: CURATED_SILVER.SUPPLIER, kind: DYNAMIC TABLE, description: "Supplier master", target_lag: 1 day, upstream: [RAW_BRONZE.ERP_SUPPLIER], grain: one row per supplier }
  - { fqn: CURATED_SILVER.CONTRACT, kind: DYNAMIC TABLE, description: "Group purchasing and framework contracts", target_lag: 1 day, upstream: [RAW_BRONZE.ERP_CONTRACT], grain: one row per contract }
  - { fqn: CURATED_SILVER.PURCHASE_ORDER_LINE, kind: DYNAMIC TABLE, description: "PO lines with receipt outcome and cycle time", target_lag: 1 hour, upstream: [RAW_BRONZE.ERP_PO_LINE], grain: one row per PO line }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2019-2026", upstream: [CURATED_SILVER.ENCOUNTER], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_FACILITY, kind: TABLE, description: "Facility dimension with market and bed-size band", target_lag: 1 day, upstream: [CURATED_SILVER.FACILITY], grain: one row per facility }
  - { fqn: CONFORMED_GOLD.DIM_UNIT, kind: TABLE, description: "Care unit dimension with facility and market", target_lag: 1 day, upstream: [CURATED_SILVER.CARE_UNIT, CONFORMED_GOLD.DIM_FACILITY], grain: one row per care unit }
  - { fqn: CONFORMED_GOLD.DIM_PATIENT, kind: TABLE, description: "Conformed patient dimension with age, risk and portal bands (PHI)", target_lag: 15 minutes, upstream: [CURATED_SILVER.PATIENT], grain: one row per patient }
  - { fqn: CONFORMED_GOLD.DIM_PROVIDER, kind: TABLE, description: "Provider dimension", target_lag: 1 day, upstream: [CURATED_SILVER.CLINICIAN], grain: one row per provider }
  - { fqn: CONFORMED_GOLD.DIM_PAYER, kind: TABLE, description: "Payer dimension with financial class", target_lag: 1 day, upstream: [CURATED_SILVER.PAYER], grain: one row per payer }
  - { fqn: CONFORMED_GOLD.DIM_SUPPLIER, kind: TABLE, description: "Supplier dimension", target_lag: 1 day, upstream: [CURATED_SILVER.SUPPLIER], grain: one row per supplier }
  - { fqn: CONFORMED_GOLD.FCT_ENCOUNTER, kind: DYNAMIC TABLE, description: "Discharged inpatient encounter fact (index admission grain)", target_lag: 15 minutes, upstream: [CURATED_SILVER.ENCOUNTER, CONFORMED_GOLD.DIM_FACILITY, CONFORMED_GOLD.DIM_PATIENT], grain: one row per discharge }
  - { fqn: CONFORMED_GOLD.FCT_ED_VISIT, kind: DYNAMIC TABLE, description: "ED visit fact with throughput timings", target_lag: 5 minutes, upstream: [CURATED_SILVER.ED_VISIT, CONFORMED_GOLD.DIM_FACILITY, CONFORMED_GOLD.DIM_PATIENT], grain: one row per ED visit }
  - { fqn: CONFORMED_GOLD.FCT_CLAIM, kind: DYNAMIC TABLE, description: "Claims with remittances within 60 days", target_lag: 1 hour, upstream: [CURATED_SILVER.CLAIM_HEADER, CURATED_SILVER.REMITTANCE, CONFORMED_GOLD.DIM_PATIENT, CONFORMED_GOLD.DIM_PAYER, CONFORMED_GOLD.DIM_FACILITY], grain: one row per claim }
  - { fqn: CONFORMED_GOLD.FCT_APPOINTMENT, kind: DYNAMIC TABLE, description: "Appointment fact with lead time and outcome flags", target_lag: 15 minutes, upstream: [CURATED_SILVER.APPOINTMENT, CONFORMED_GOLD.DIM_PROVIDER, CONFORMED_GOLD.DIM_FACILITY, CONFORMED_GOLD.DIM_PATIENT], grain: one row per appointment }
  - { fqn: CONFORMED_GOLD.FCT_SUPPLY_SPEND, kind: DYNAMIC TABLE, description: "PO line spend fact", target_lag: 1 hour, upstream: [CURATED_SILVER.PURCHASE_ORDER_LINE, CONFORMED_GOLD.DIM_SUPPLIER], grain: one row per PO line }
  - { fqn: CONFORMED_GOLD.FCT_UNIT_DAY, kind: DYNAMIC TABLE, description: "Care unit day fact: census, staffed beds and nursing hours", target_lag: 1 hour, upstream: [CURATED_SILVER.STAFFING_DAY, CONFORMED_GOLD.DIM_UNIT], grain: one row per care unit per day }
  - { fqn: CONFORMED_GOLD.FCT_SURVEY, kind: DYNAMIC TABLE, description: "Patient experience survey fact", target_lag: 1 day, upstream: [CURATED_SILVER.SURVEY_RESPONSE, CONFORMED_GOLD.DIM_FACILITY, CONFORMED_GOLD.DIM_PATIENT], grain: one row per survey }
