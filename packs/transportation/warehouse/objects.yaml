# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.TERMINAL, kind: DYNAMIC TABLE, description: "Conformed terminal, cross-dock and drop-yard master", target_lag: 1 day, upstream: [RAW_BRONZE.TMS_TERMINAL], grain: one row per terminal }
  - { fqn: CURATED_SILVER.SHIPPER, kind: DYNAMIC TABLE, description: "Shipper (customer) master with logistics contact, deduplicated and conformed", target_lag: 1 day, upstream: [RAW_BRONZE.TMS_CUSTOMER], grain: one row per customer }
  - { fqn: CURATED_SILVER.TRACTOR, kind: DYNAMIC TABLE, description: "Tractor (power unit) register", target_lag: 1 day, upstream: [RAW_BRONZE.FLT_TRACTOR], grain: one row per tractor }
  - { fqn: CURATED_SILVER.DRIVER_ROSTER, kind: DYNAMIC TABLE, description: "Driver roster with hire and separation dates", target_lag: 1 hour, upstream: [RAW_BRONZE.HR_DRIVER], grain: one row per driver }
  - { fqn: CURATED_SILVER.SHIPMENT_LOAD, kind: DYNAMIC TABLE, description: "Deduplicated loads with delivery outcome, delay cause and detention", target_lag: 15 minutes, upstream: [RAW_BRONZE.TMS_LOAD], grain: one row per load }
  - { fqn: CURATED_SILVER.FLEET_DAY, kind: DYNAMIC TABLE, description: "One telematics record per tractor and day", target_lag: 1 hour, upstream: [RAW_BRONZE.ELD_FLEET_DAY], grain: one row per tractor per day }
  - { fqn: CURATED_SILVER.SAFETY_EVENT, kind: DYNAMIC TABLE, description: "Safety events with DOT-recordable and preventable flags", target_lag: 1 hour, upstream: [RAW_BRONZE.SAF_EVENT], grain: one row per event }
  - { fqn: CURATED_SILVER.CARGO_CLAIM, kind: DYNAMIC TABLE, description: "Cargo claims raised against loads", target_lag: 1 day, upstream: [RAW_BRONZE.CLM_CARGO_CLAIM], grain: one row per claim }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2019-2026", upstream: [CURATED_SILVER.SHIPMENT_LOAD], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_TERMINAL, kind: TABLE, description: "Terminal dimension with operating region", target_lag: 1 day, upstream: [CURATED_SILVER.TERMINAL], grain: one row per terminal }
  - { fqn: CONFORMED_GOLD.DIM_CUSTOMER, kind: TABLE, description: "Shipper dimension with segment, contract type and logistics contact", target_lag: 1 day, upstream: [CURATED_SILVER.SHIPPER], grain: one row per customer }
  - { fqn: CONFORMED_GOLD.DIM_TRACTOR, kind: TABLE, description: "Tractor dimension with home terminal and model-year band", target_lag: 1 day, upstream: [CURATED_SILVER.TRACTOR, CONFORMED_GOLD.DIM_TERMINAL], grain: one row per tractor }
  - { fqn: CONFORMED_GOLD.DIM_DRIVER, kind: TABLE, description: "Driver dimension with home region, status and tenure band", target_lag: 1 hour, upstream: [CURATED_SILVER.DRIVER_ROSTER, CONFORMED_GOLD.DIM_TERMINAL], grain: one row per driver }
  - { fqn: CONFORMED_GOLD.FCT_LOAD, kind: DYNAMIC TABLE, description: "Load fact: miles, revenue, cost, claims, dwell and delivery outcome", target_lag: 15 minutes, upstream: [CURATED_SILVER.SHIPMENT_LOAD, CURATED_SILVER.CARGO_CLAIM, CONFORMED_GOLD.DIM_CUSTOMER, CONFORMED_GOLD.DIM_TERMINAL, CONFORMED_GOLD.DIM_TRACTOR, CONFORMED_GOLD.DIM_DRIVER], grain: one row per load }
  - { fqn: CONFORMED_GOLD.FCT_FLEET_DAY, kind: DYNAMIC TABLE, description: "Tractor-day fact: available and revenue hours, miles, fuel and revenue", target_lag: 1 hour, upstream: [CURATED_SILVER.FLEET_DAY, CONFORMED_GOLD.DIM_TRACTOR, CONFORMED_GOLD.DIM_DRIVER], grain: one row per tractor per day }
  - { fqn: CONFORMED_GOLD.FCT_DRIVER_MONTH, kind: DYNAMIC TABLE, description: "Driver-month fact: miles, safety events, headcount and separations", target_lag: 1 day, upstream: [CONFORMED_GOLD.DIM_DRIVER, CURATED_SILVER.FLEET_DAY, CURATED_SILVER.SAFETY_EVENT], grain: one row per driver per month }
