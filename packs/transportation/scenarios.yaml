- id: SC-TRN-019
  agent: AG-TRN-002
  pattern: 15
  question: "What can you answer?"
  paraphrases:
    - "What can you help me with?"
    - "help"
  kind: help
  query: null
  answer:
    headline: "I answer questions about fleet productivity and driver safety — not delivery service or freight cost."
    narrative: "Ask me about asset utilisation, empty miles, fuel economy, revenue per truck, crash rates, hours-of-service violations or driver turnover. For on-time delivery, dwell or cost per mile, ask the Delivery SLA Sentinel."
    chart: none
  followups: ["Which equipment types had the lowest asset utilisation last quarter?", "Is the safety incident rate within target over the last 12 months?", "Where is driver turnover highest by region over the last 12 months?"]

- id: SC-TRN-020
  agent: AG-TRN-002
  pattern: 15
  question: "Put driver D-00417 on a final written warning for last week's crash."
  paraphrases:
    - "Suspend the driver who had the crash on Tuesday"
    - "Can you start disciplinary action against a driver?"
  kind: decline
  query: null
  answer:
    headline: "I can't take or recommend action against an individual driver — agents act, humans decide."
    narrative: "Coaching, discipline and dismissal are decided by a named safety manager on the driver's full record (BR-TRN-014). I can show crash rates and hours-of-service violations by region, driver type or tenure."
    chart: none
  followups: ["Is the safety incident rate within target over the last 12 months?", "Safety incident rate by region over the last 12 months"]
