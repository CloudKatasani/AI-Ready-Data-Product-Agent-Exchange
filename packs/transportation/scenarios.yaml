    narrative: "The middle 80% of terminals sit between {{top.fuel_mpg_p10}} and {{top.fuel_mpg_p90}} mpg; the least efficient terminal gets {{top.fuel_mpg_min}} mpg (total miles over total gallons, BR-TRN-008)."
    chart: table
  followups: ["Fuel economy by model year band this year", "Fuel economy by equipment type this year"]
  expect: { rows: 1 }

