id: DP-TRN-004
name: Freight Cost & Margin
domain: Freight Finance
archetype: CONSUMER_ALIGNED
initial_status: IN_CERTIFICATION
seed_stage: 11
version: 1.0.0-rc.1
owner: transportation:ops-dpo
steward: transportation:data-steward
description: Load economics — linehaul, fuel surcharge and detention revenue against operating, fuel and accessorial cost and cargo claims, by region, shipper and segment.
purpose: Give finance and pricing a certified view of cost per mile, revenue per loaded mile, operating ratio and the claims ratio, read from what was billed and spent rather than what was planned.
decision: { persona: Chief Financial Officer, decision: "Which lanes, segments and shippers to reprice or exit at the next bid cycle", cadence: Quarterly, workaround: "Quarterly lane profitability model rebuilt from settlement and claims exports", consequence: "Bids renew at rates that lose money on empty repositioning and claims nobody allocated" }
sample_questions: ["What is the operating ratio this year?", "Cost per mile by quarter", "Claims ratio by shipper segment"]
semantic_view: FREIGHT_ECONOMICS
output_ports:
  - { kind: semantic, ref: FREIGHT_ECONOMICS }
  - { kind: sql, ref: DATA_PRODUCTS.DP_TRN_004_FREIGHT_COST_MARGIN }
  - { kind: agent, ref: AG-TRN-001 }
sla: { freshness_minutes: 1440, availability_pct: 99.5, max_null_rate_pct: 0.5 }
kpis: [KPI-TRN-OR, KPI-TRN-CPM, KPI-TRN-RPM, KPI-TRN-CLAIMS]
upstream: [CONFORMED_GOLD.FCT_LOAD, CONFORMED_GOLD.DIM_CUSTOMER, CONFORMED_GOLD.DIM_TERMINAL, CURATED_SILVER.CARGO_CLAIM]
consumers: [Finance, Pricing, Claims, Delivery SLA Sentinel agent]
lifecycle_seed: { artifacts: auto }
certification_script:
  initial: { gate4: warn, gate6: fail }
  fixes:
    - { id: FIX-1, check: semantic.verified_queries, label: "Add 3 verified queries for the claims ratio", effect: { overlay: VERIFIED_QUERY, keys: [VQ-TRN-067, VQ-TRN-068, VQ-TRN-069] } }
    - { id: FIX-2, check: governance.masking, label: "Attach PII masking to shipper contact email and phone", effect: { policy_attach: { policy: MASK_EMAIL, columns: [CONFORMED_GOLD.DIM_CUSTOMER.contact_email, CONFORMED_GOLD.DIM_CUSTOMER.contact_phone] } } }
value_case: VC-TRN-004
