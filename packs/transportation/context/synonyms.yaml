# Meridian Freight Lines synonyms (synthetic): trucking jargon → governed metric, dimension, value or glossary term.

# ── Shipments & service ──────────────────────────────────────────────────────────────────────────────
- term: On-time delivery
  synonyms: [on time, on-time %, otp, service performance, delivery reliability]
  maps_to: { kind: metric, ref: on_time_delivery_pct }
- term: Average dwell time
  synonyms: [dock time, wait time, detention time, time at shipper]
  maps_to: { kind: metric, ref: avg_dwell_hours }
- term: Exception rate
  synonyms: [service failures, damage and refusals, exception %]
  maps_to: { kind: metric, ref: exception_rate_pct }
- term: Loads delivered
  synonyms: [load volume, number of shipments, loads moved]
  maps_to: { kind: metric, ref: loads_delivered }
- term: Origin terminal
  synonyms: [origin, pickup terminal, origin facilities]
  maps_to: { kind: dimension, ref: terminal }
- term: Shipper segment
  synonyms: [industry segment, customer vertical]
  maps_to: { kind: dimension, ref: customer_segment }
- term: Building materials
  synonyms: [construction shippers, building supply]
  maps_to: { kind: value, ref: customer_segment=Building materials }
- term: Food & beverage
  synonyms: [food shippers, grocery shippers, f&b]
  maps_to: { kind: value, ref: customer_segment=Food & beverage }

