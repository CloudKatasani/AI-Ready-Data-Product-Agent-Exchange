# Silver/Gold object metadata for Explorer display and lineage (upstream edges).
objects:
  - { fqn: CURATED_SILVER.CUSTOMER_ACCOUNT, kind: DYNAMIC TABLE, description: "Account master, deduplicated and conformed", target_lag: 15 minutes, upstream: [RAW_BRONZE.CRM_ACCOUNT], grain: one row per account }
  - { fqn: CURATED_SILVER.SALES_REP, kind: DYNAMIC TABLE, description: "Account executives and sales teams", target_lag: 1 day, upstream: [RAW_BRONZE.CRM_SALES_REP], grain: one row per rep }
  - { fqn: CURATED_SILVER.ACCOUNT_CONTACT, kind: DYNAMIC TABLE, description: "Account contacts, deduplicated", target_lag: 15 minutes, upstream: [RAW_BRONZE.CRM_CONTACT], grain: one row per contact }
  - { fqn: CURATED_SILVER.SUBSCRIPTION_LINE, kind: DYNAMIC TABLE, description: "Base subscriptions and add-on lines in one shape, with revenue stream and co-terming", target_lag: 1 hour, upstream: [RAW_BRONZE.BILL_SUBSCRIPTION, RAW_BRONZE.BILL_ADDON_LINE], grain: one row per subscription line }
  - { fqn: CURATED_SILVER.SALES_OPPORTUNITY, kind: DYNAMIC TABLE, description: "Opportunities with conformed type, source and stage", target_lag: 15 minutes, upstream: [RAW_BRONZE.CRM_OPPORTUNITY], grain: one row per opportunity }
  - { fqn: CURATED_SILVER.USAGE_DAILY, kind: DYNAMIC TABLE, description: "One telemetry row per account per day", target_lag: 1 hour, upstream: [RAW_BRONZE.TELEMETRY_USAGE_DAILY], grain: one row per account per day }
  - { fqn: CURATED_SILVER.FEATURE_USAGE, kind: DYNAMIC TABLE, description: "Latest thirty-day usage per account and feature", target_lag: 1 day, upstream: [RAW_BRONZE.TELEMETRY_FEATURE_USAGE], grain: one row per account per feature }
  - { fqn: CURATED_SILVER.SUPPORT_TICKET, kind: DYNAMIC TABLE, description: "Helpdesk tickets, deduplicated and conformed", target_lag: 15 minutes, upstream: [RAW_BRONZE.HELPDESK_TICKET], grain: one row per ticket }
  - { fqn: CONFORMED_GOLD.DIM_DATE, kind: TABLE, description: "Calendar 2019-2027", upstream: [CURATED_SILVER.SALES_OPPORTUNITY], grain: one row per day }
  - { fqn: CONFORMED_GOLD.DIM_ACCOUNT, kind: TABLE, description: "Account dimension with plan tier, seats, land and cancellation dates", target_lag: 1 hour, upstream: [CURATED_SILVER.CUSTOMER_ACCOUNT, CURATED_SILVER.SUBSCRIPTION_LINE], grain: one row per account }
  - { fqn: CONFORMED_GOLD.DIM_CONTACT, kind: TABLE, description: "Contact dimension (personal data masked by policy)", target_lag: 1 hour, upstream: [CURATED_SILVER.ACCOUNT_CONTACT, CONFORMED_GOLD.DIM_ACCOUNT], grain: one row per contact }
  - { fqn: CONFORMED_GOLD.FCT_ARR_MONTHLY, kind: DYNAMIC TABLE, description: "Month-end ARR per account and revenue stream with 1- and 12-month lookbacks", target_lag: 1 hour, upstream: [CURATED_SILVER.SUBSCRIPTION_LINE, CONFORMED_GOLD.DIM_ACCOUNT], grain: one row per account per month-end per revenue stream }
  - { fqn: CONFORMED_GOLD.FCT_OPPORTUNITY, kind: DYNAMIC TABLE, description: "Opportunity fact keyed to close date", target_lag: 15 minutes, upstream: [CURATED_SILVER.SALES_OPPORTUNITY, CURATED_SILVER.SALES_REP, CONFORMED_GOLD.DIM_ACCOUNT], grain: one row per opportunity }
  - { fqn: CONFORMED_GOLD.FCT_PRODUCT_USAGE, kind: DYNAMIC TABLE, description: "Tenant-day usage for paying customers", target_lag: 1 hour, upstream: [CURATED_SILVER.USAGE_DAILY, CONFORMED_GOLD.DIM_ACCOUNT], grain: one row per account per day }
  - { fqn: CONFORMED_GOLD.FCT_FEATURE_ADOPTION, kind: DYNAMIC TABLE, description: "Thirty-day feature adoption with entitlement, active customers only", target_lag: 1 day, upstream: [CURATED_SILVER.FEATURE_USAGE, CONFORMED_GOLD.DIM_ACCOUNT], grain: one row per account per feature }
  - { fqn: CONFORMED_GOLD.FCT_SUPPORT_TICKET, kind: DYNAMIC TABLE, description: "Support ticket fact with first-response SLA outcome", target_lag: 15 minutes, upstream: [CURATED_SILVER.SUPPORT_TICKET, CONFORMED_GOLD.DIM_ACCOUNT, CONFORMED_GOLD.DIM_CONTACT], grain: one row per ticket }
