eval: { golden_min: 0.92, groundedness_min: 1.0, boundary_min: 1.0, adversarial_min: 1.0, entitlement_min: 1.0 }
scenarios: [SC-TCH-001, SC-TCH-002, SC-TCH-003, SC-TCH-004, SC-TCH-005, SC-TCH-006, SC-TCH-007, SC-TCH-008, SC-TCH-009, SC-TCH-010]
